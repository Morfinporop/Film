<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фильмы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/hls.min.js"></script>
<style>
  :root {
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --line: rgba(255,255,255,.1);
    --panel: rgba(20,20,22,.62);
    --accent: #ffffff;
    --danger: #ef4444;
    --gold: #e7c15a;
    --bg-url: url("https://i.pinimg.com/1200x/93/31/9d/93319d1600bd69fcb7db28fef7b4a7bb.jpg");
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: #0b0b0c var(--bg-url) center / cover fixed no-repeat;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(180deg, rgba(0,0,0,.72), rgba(0,0,0,.9));
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  img { display: block; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 20px 140px; }
  h1 { font-size: 26px; font-weight: 650; margin: 0 0 6px; letter-spacing: -.01em; }
  h2 { font-size: 18px; font-weight: 600; margin: 0 0 12px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; line-height: 1.5; }
  .section { margin-top: 36px; }
  .glass {
    background: var(--panel); border: 1px solid var(--line); border-radius: 22px;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); padding: 20px;
  }

  /* ---- нижняя навигация ---- */
  .nav {
    position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: min(calc(100% - 48px), 380px);
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
    padding: 8px; border-radius: 999px; z-index: 10;
    background: rgba(28,28,30,.55);
    border: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%);
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .nav button {
    width: 52px; height: 52px; border-radius: 50%; border: 0;
    background: transparent; color: var(--muted);
    display: grid; place-items: center; transition: background .2s, color .2s;
  }
  .nav button.on { background: rgba(255,255,255,.16); color: #fff; }
  .nav svg { width: 22px; height: 22px; }
  .nav .hidden { display: none; }

  /* ---- кнопки ---- */
  .btn {
    border: 0; border-radius: 999px; padding: 12px 20px; font-weight: 600; font-size: 15px;
    background: #fff; color: #000; transition: opacity .2s;
  }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.ghost { background: rgba(255,255,255,.1); color: var(--text); }
  .btn.danger { background: rgba(239,68,68,.16); color: #fca5a5; }
  .btn.small { padding: 8px 14px; font-size: 13px; }
  .btn.round { width: 40px; height: 40px; padding: 0; display: inline-grid; place-items: center; border-radius: 50%; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .spacer { flex: 1; }

  /* ---- поля ---- */
  input[type=text], input[type=search], input[type=number], input[type=date], input[type=url], select, textarea {
    width: 100%; padding: 13px 16px; border-radius: 16px; border: 1px solid var(--line);
    background: rgba(0,0,0,.35); outline: none; font-size: 15px;
  }
  input:focus, select:focus, textarea:focus { border-color: rgba(255,255,255,.35); }
  textarea { resize: vertical; min-height: 96px; }
  label.field { display: block; margin-bottom: 14px; }
  label.field > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .check { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 14px; }

  /* ---- сетка фильмов ---- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px; }
  .card { cursor: pointer; text-decoration: none; }
  .cover {
    position: relative; aspect-ratio: 2 / 3; border-radius: 20px; overflow: hidden;
    background: linear-gradient(160deg, #3f3f46, #18181b);
    box-shadow: 0 12px 30px rgba(0,0,0,.4);
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  .vip-badge {
    position: absolute; left: 12px; top: 12px; padding: 6px 12px; border-radius: 999px;
    background: rgba(0,0,0,.55); color: var(--gold); font-size: 12px; font-weight: 650;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .cover .vip-text {
    position: absolute; inset: auto 0 22% 0; text-align: center; font-size: 22px; font-weight: 800;
    color: var(--gold); text-shadow: 0 2px 14px rgba(0,0,0,.8); letter-spacing: .04em; text-transform: uppercase;
  }
  .card .title { margin: 12px 4px 2px; font-weight: 600; font-size: 15px; line-height: 1.3; }
  .card .meta { margin: 0 4px; color: var(--muted); font-size: 13px; }
  .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.1); font-size: 12px; color: var(--muted); }
  .pill.ok { color: #86efac; }
  .pill.wait { color: #fde68a; }
  .pill.bad { color: #fca5a5; }

  /* ---- экран фильма ---- */
  .hero { position: relative; margin: -28px -20px 0; padding: 28px 20px 32px; overflow: hidden; border-radius: 0 0 28px 28px; }
  .hero::before {
    content: ""; position: absolute; inset: -40px; z-index: -2;
    background: var(--poster) center / cover no-repeat; filter: blur(34px) brightness(.45); transform: scale(1.1);
  }
  .hero::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(0,0,0,.2), rgba(10,10,12,.92)); }
  .hero-inner { display: grid; grid-template-columns: 150px 1fr; gap: 20px; align-items: end; }
  .hero .cover { border-radius: 18px; }
  .hero h1 { font-size: 24px; }
  .facts { color: var(--muted); font-size: 14px; line-height: 1.8; margin-top: 8px; }
  .facts b { color: var(--text); font-weight: 500; }
  .desc { line-height: 1.65; color: #d4d4d8; white-space: pre-wrap; font-size: 15px; margin: 0; }
  .player { width: 100%; border-radius: 20px; background: #000; overflow: hidden; aspect-ratio: 16 / 9; }
  .player video, .player iframe { width: 100%; height: 100%; border: 0; display: block; }
  .player.vertical { aspect-ratio: 9 / 16; max-height: 70vh; margin: 0 auto; width: auto; }
  .qualities { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .qualities button {
    border: 0; border-radius: 999px; padding: 8px 14px; background: rgba(255,255,255,.08); color: var(--muted); font-size: 13px;
  }
  .qualities button.on { background: #fff; color: #000; font-weight: 600; }
  .locked {
    aspect-ratio: 16 / 9; border-radius: 20px; display: grid; place-items: center; text-align: center; padding: 24px;
    background: rgba(0,0,0,.5); border: 1px solid var(--line);
  }
  .stars { display: inline-flex; gap: 4px; }
  .stars button { border: 0; background: none; font-size: 26px; line-height: 1; color: #3f3f46; padding: 0 2px; }
  .stars button.on { color: var(--gold); }
  .item { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .head { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--muted); }
  .item .head b { color: var(--text); font-weight: 600; }
  .item p { margin: 6px 0 0; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }

  /* ---- тосты, модалка ---- */
  .toast {
    position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 50;
    background: rgba(24,24,27,.9); border: 1px solid var(--line); padding: 12px 18px; border-radius: 999px;
    font-size: 14px; max-width: calc(100% - 40px); text-align: center; display: none;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .toast.show { display: block; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; font-size: 15px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .tabs button { border: 0; border-radius: 999px; padding: 9px 16px; background: rgba(255,255,255,.08); color: var(--muted); font-size: 14px; }
  .tabs button.on { background: #fff; color: #000; font-weight: 600; }
  .list-row { display: flex; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .list-row:last-child { border-bottom: 0; }
  .list-row .info { flex: 1; min-width: 0; }
  .list-row .info b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list-row .info small { color: var(--muted); font-size: 13px; }
  .thumb { width: 44px; height: 64px; border-radius: 10px; overflow: hidden; background: #27272a; flex: none; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .progress { height: 6px; background: rgba(255,255,255,.1); border-radius: 999px; overflow: hidden; margin-top: 10px; display: none; }
  .progress div { height: 100%; width: 0; background: #fff; transition: width .2s; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
  .stat { padding: 16px; border-radius: 18px; background: rgba(0,0,0,.3); border: 1px solid var(--line); }
  .stat b { display: block; font-size: 22px; font-weight: 650; }
  .stat small { color: var(--muted); font-size: 13px; }
  .plans { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .plan { padding: 20px; border-radius: 22px; background: rgba(0,0,0,.35); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
  .plan .price { font-size: 26px; font-weight: 700; }
  .plan small { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .hidden { display: none !important; }
  @media (max-width: 480px) {
    .plans { grid-template-columns: 1fr; }
    .hero-inner { grid-template-columns: 116px 1fr; gap: 14px; }
    .hero h1 { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<nav class="nav" id="nav">
  <button data-go="catalog" title="Каталог" aria-label="Каталог">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
  </button>
  <button data-go="search" title="Поиск" aria-label="Поиск">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5" stroke-linecap="round"/></svg>
  </button>
  <button data-go="vip" title="VIP" aria-label="VIP">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3.1-5.4 3.1 1.2-6L3.3 9.3l6.1-.7z"/></svg>
  </button>
  <button data-go="profile" title="Профиль" aria-label="Профиль">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" stroke-linecap="round"/></svg>
  </button>
  <button data-go="admin" id="navAdmin" class="hidden" title="Админ-панель" aria-label="Админ-панель">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4" stroke-linecap="round"/></svg>
  </button>
</nav>
<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (_) {} }
  const app = document.getElementById("app");
  const nav = document.getElementById("nav");

  const S = {
    me: { guest: true }, config: null, films: [], route: "catalog", hls: null, timer: null, adminTab: "films",
    search: "", editId: null,
  };

  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const $ = (sel, root = document) => root.querySelector(sel);
  const toast = (text) => {
    const el = document.getElementById("toast");
    el.textContent = text; el.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 2800);
  };
  const ERRORS = {
    auth: "Откройте приложение из Telegram", forbidden: "Недостаточно прав", not_found: "Не найдено",
    vip_required: "Нужна подписка VIP", bad_request: "Проверьте данные", bad_rating: "Оценка от 1 до 5",
    empty: "Пустой текст", title_required: "Укажите название", bad_url: "Некорректная ссылка",
    video_required: "Выберите видеофайл", poster_required: "Выберите обложку", bad_kind: "Неверный тип",
    bad_role: "Неверная роль", bad_id: "Неверный ID", bad_days: "Неверный срок", owner: "Это владелец",
    not_refundable: "Возврат невозможен", telegram_refused: "Telegram отклонил возврат", already: "Эта роль уже есть",
    bad_amount: "Неверная сумма", processing: "Идёт обработка",
  };
  const errText = (code) => ERRORS[code] || "Ошибка, попробуйте ещё раз";

  function initData() { return (tg && tg.initData) || ""; }

  async function api(path, opts = {}) {
    const headers = { "X-Init-Data": initData() };
    let body = opts.body;
    if (body && !(body instanceof FormData)) { headers["Content-Type"] = "application/json"; body = JSON.stringify(body); }
    const res = await fetch(path, { method: opts.method || (body ? "POST" : "GET"), headers, body });
    let data = null;
    try { data = await res.json(); } catch (_) {}
    return { ok: res.ok, status: res.status, data: data || {} };
  }

  async function call(path, opts) {
    const r = await api(path, opts);
    if (!r.ok) { toast(errText(r.data.error)); throw new Error(r.data.error || r.status); }
    return r.data;
  }

  function fmtDate(iso) {
    if (!iso) return "";
    const d = new Date(iso.replace(" ", "T") + "Z");
    return isNaN(d) ? iso : d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
  }
  function fmtRelease(s) {
    if (!s) return "не указана";
    const d = new Date(s + "T00:00:00");
    return isNaN(d) ? s : d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
  }
  function duration(sec) {
    if (!sec) return "";
    const m = Math.floor(sec / 60), s = sec % 60;
    return `${m}:${String(s).padStart(2, "0")}`;
  }
  function statusPill(f) {
    if (f.status === "processing") return '<span class="pill wait">Обработка</span>';
    if (f.status === "failed") return '<span class="pill bad">Ошибка</span>';
    return '<span class="pill ok">Готов</span>';
  }

  // ---- маршрут ----
  function parseRoute() {
    const h = (location.hash || "").replace(/^#\/?/, "");
    const parts = h.split("/").filter(Boolean);
    if (parts[0] === "film" && parts[1]) return { name: "film", id: parts[1] };
    if (parts[0] === "admin") {
      if (parts[1] === "upload") return { name: "admin", tab: "upload" };
      if (parts[1] === "film" && parts[2]) return { name: "admin", tab: "films", edit: parts[2] };
      if (parts[1] === "users" || parts[1] === "sales") return { name: "admin", tab: parts[1] };
      return { name: "admin", tab: "films" };
    }
    if (["search", "vip", "profile"].includes(parts[0])) return { name: parts[0] };
    return { name: "catalog" };
  }

  function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }

  function setNav(name) {
    nav.querySelectorAll("button[data-go]").forEach((b) => {
      const key = b.dataset.go;
      b.classList.toggle("on", key === name || (name === "film" && key === "catalog"));
    });
  }

  nav.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-go]");
    if (b) go("#/" + b.dataset.go);
  });

  function stopPlayer() {
    if (S.hls) { try { S.hls.destroy(); } catch (_) {} S.hls = null; }
  }

  window.addEventListener("hashchange", render);

  async function render() {
    stopPlayer();
    clearInterval(S.timer); S.timer = null;
    const r = parseRoute();
    S.route = r.name;
    setNav(r.name);
    if (r.name === "admin" && !(S.me.canUpload)) { go("#/catalog"); return; }
    if (r.name === "admin" && r.tab === "users" && !S.me.canManage) { go("#/admin"); return; }
    if (r.name === "admin" && r.tab === "sales" && !S.me.isOwner) { go("#/admin"); return; }
    try {
      if (r.name === "catalog") await viewCatalog();
      else if (r.name === "search") await viewSearch();
      else if (r.name === "film") await viewFilm(r.id);
      else if (r.name === "vip") viewVip();
      else if (r.name === "profile") viewProfile();
      else if (r.name === "admin") await viewAdmin(r);
    } catch (e) { console.error(e); }
    window.scrollTo({ top: 0 });
  }

  async function loadMe() {
    S.me = await call("/api/me").catch(() => ({ guest: true }));
    S.me.guest = S.me.guest !== false;
    nav.querySelector("#navAdmin").classList.toggle("hidden", !S.me.canUpload);
  }
  async function loadConfig() {
    S.config = await call("/api/config").catch(() => null) || { prices: { vipMonth: 100, vipYear: 900, editor: 500, admin: 2000 }, donate: [50, 100, 250, 500] };
  }

  // ---- каталог и поиск ----
  function filmCard(f) {
    const cover = f.hasPoster
      ? `<img src="/api/films/${f.id}/poster" alt="" loading="lazy" onerror="this.remove()">`
      : "";
    return `<a class="card" href="#/film/${f.id}">
      <div class="cover">${cover}
        ${f.isVip ? '<span class="vip-badge">VIP</span><div class="vip-text">Для VIP</div>' : ""}
      </div>
      <div class="title">${esc(f.title)}</div>
      <div class="meta">${esc(f.releaseDate ? f.releaseDate.slice(0, 4) : "")}${f.creator ? " · " + esc(f.creator) : ""}</div>
    </a>`;
  }

  async function viewCatalog() {
    S.films = await call("/api/films").catch(() => []);
    app.innerHTML = `
      <h1>Фильмы</h1>
      <p class="sub">Смотрите фильмы и сериалы в лучшем качестве. Выбирайте 360p, 720p или 1080p.</p>
      ${S.films.length ? `<div class="grid">${S.films.map(filmCard).join("")}</div>` : '<div class="empty">Пока нет фильмов</div>'}`;
  }

  async function viewSearch() {
    if (!S.films.length) S.films = await call("/api/films").catch(() => []);
    app.innerHTML = `
      <h1>Поиск</h1>
      <p class="sub">Название, автор или описание.</p>
      <input type="search" id="q" placeholder="Что посмотреть?" value="${esc(S.search)}" autocomplete="off">
      <div class="section" id="res"></div>`;
    const input = $("#q");
    const draw = () => {
      S.search = input.value.trim().toLowerCase();
      const list = S.films.filter((f) => !S.search || [f.title, f.creator, f.description].join(" ").toLowerCase().includes(S.search));
      $("#res").innerHTML = list.length ? `<div class="grid">${list.map(filmCard).join("")}</div>` : '<div class="empty">Ничего не найдено</div>';
    };
    input.addEventListener("input", draw);
    draw();
    input.focus();
  }

  // ---- фильм ----
  async function viewFilm(id) {
    const f = await call(`/api/films/${id}`).catch(() => null);
    S.filmId = id;
    if (!f) { app.innerHTML = '<div class="empty">Фильм не найден</div>'; return; }
    const poster = f.hasPoster ? `/api/films/${f.id}/poster` : "";
    const starsHtml = (n, set) => [1, 2, 3, 4, 5].map((i) => `<button type="button" data-star="${i}" class="${i <= n ? "on" : ""}" ${set ? "" : "disabled"}>★</button>`).join("");
    const reviewsHtml = f.reviews.length
      ? f.reviews.map((r) => `<div class="item">
          <div class="head"><b>${esc(r.name)}</b><span>${"★".repeat(r.rating)}</span><span>${esc(fmtDate(r.date))}</span>
          ${r.canDelete ? `<span class="spacer"></span><button class="btn ghost small" data-del-review="${r.id}">Удалить</button>` : ""}</div>
          ${r.text ? `<p>${esc(r.text)}</p>` : ""}</div>`).join("")
      : '<div class="sub" style="margin:0">Отзывов пока нет</div>';
    const commentsHtml = f.comments.length
      ? f.comments.map((c) => `<div class="item">
          <div class="head"><b>${esc(c.name)}</b><span>${esc(fmtDate(c.date))}</span>
          ${c.canDelete ? `<span class="spacer"></span><button class="btn ghost small" data-del-comment="${c.id}">Удалить</button>` : ""}</div>
          <p>${esc(c.text)}</p></div>`).join("")
      : '<div class="sub" style="margin:0">Комментариев пока нет</div>';
    const canWrite = !S.me.guest && !f.locked;

  async function renderPlayer(f) {
    const box = $("#player");
    if (f.locked) {
      box.innerHTML = `<div class="locked"><div>

        <p class="sub" style="margin-bottom:16px">Подписка открывает все VIP-фильмы.</p>

      box.querySelector("[data-go-vip]").onclick = () => go("#/vip");
      return;
    }
    if (f.status !== "ready" && f.kind === "video") {
      box.innerHTML = `<div class="locked"><p class="sub" style="margin:0">Фильм обрабатывается. Обычно это несколько минут.</p></div>`;
      S.timer = setInterval(() => { if (S.route === "film") viewFilm(f.id); }, 15000);
      return;
    }
    const r = await api(`/api/films/${f.id}/play`, { method: "POST" });
    if (!r.ok) {
      box.innerHTML = `<div class="locked"><p class="sub" style="margin:0">${esc(errText(r.data.error))}</p></div>`;
      return;
    }
    if (r.data.kind === "link") {
      box.innerHTML = `<div class="player"><iframe src="${esc(r.data.src)}" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe></div>`;
      return;
    }
    const vertical = f.height > f.width && f.width > 0;
    box.innerHTML = `<div class="player ${vertical ? "vertical" : ""}"><video id="video" controls playsinline></video></div>
      <div class="qualities" id="qualities"></div>`;
    const video = $("#video");
    if (window.Hls && Hls.isSupported()) {
      const hls = new Hls({ capLevelToPlayerSize: false });
      S.hls = hls;
      hls.loadSource(r.data.src);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => drawQualities(hls));
      hls.on(Hls.Events.LEVEL_SWITCHED, () => drawQualities(hls));
    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
      video.src = r.data.src;
    } else {
      box.innerHTML = '<div class="locked"><p class="sub" style="margin:0">Браузер не поддерживает воспроизведение</p></div>';
    }

  function drawQualities(hls) {
    const box = $("#qualities");
    if (!box) return;
    const levels = hls.levels.map((l, i) => ({ i, h: l.height })).sort((a, b) => b.h - a.h);
    const cur = hls.currentLevel;
    const auto = hls.autoLevelEnabled;
    box.innerHTML = `<button data-q="-1" class="${auto ? "on" : ""}">Авто</button>` +
      levels.map((l) => `<button data-q="${l.i}" class="${!auto && cur === l.i ? "on" : ""}">${l.h}p</button>`).join("");
    box.onclick = (e) => {
      const b = e.target.closest("button[data-q]");
      if (!b) return;
      hls.currentLevel = Number(b.dataset.q);
      drawQualities(hls);
    };
  }

  function upload(url, fd, progressEl) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open("POST", url);
      xhr.setRequestHeader("X-Init-Data", initData());
      if (progressEl) {
        progressEl.style.display = "block";
        xhr.upload.onprogress = (e) => { if (e.lengthComputable) progressEl.firstElementChild.style.width = Math.round(e.loaded / e.total * 100) + "%"; };
      }
      xhr.onload = () => {
        let data = {};
        try { data = JSON.parse(xhr.responseText); } catch (_) {}
        if (xhr.status >= 200 && xhr.status < 300) resolve(data);
        else { toast(errText(data.error)); reject(new Error(data.error)); }
      };
      xhr.onerror = () => { toast("Сеть недоступна"); reject(new Error("network")); };
      xhr.send(fd);
    });
  }

        <div class="stat"><b>${stats.films ?? 0}</b><small>Фильмов</small></div>
        <div class="stat"><b>${stats.views ?? 0}</b><small>Просмотров</small></div>
      </div>
      <h2 class="section">Последние оплаты</h2>
      ${sales.sales.length ? sales.sales.map((s) => `<div class="list-row">
        <div class="info"><b>${esc(s.label)} · ${s.amount} ★</b><small>${esc(s.user)} · ${esc(fmtDate(s.date))}${s.refunded ? " · возвращено" : ""}</small></div>
        ${s.refundable ? `<button class="btn danger small" data-refund="${s.id}">Вернуть</button>` : ""}
      </div>`).join("") : '<div class="empty">Продаж пока нет</div>'}`;
    box.onclick = async (e) => {
      const b = e.target.closest("button[data-refund]");
      if (!b || !confirm("Вернуть звёзды покупателю?")) return;
      await call(`/api/admin/sales/${b.dataset.refund}/refund`, { body: {} }).catch(() => null);
      toast("Возврат выполнен"); adminSales();
    };
  }

  // ---- старт ----
  (async function boot() {
    await Promise.all([loadMe(), loadConfig()]);
    if (!location.hash) location.hash = "#/catalog";
    render();
  })();
})();
</script>
</body>
</html>
