<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Фильмы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0a0a0c;
      --text: #f4f4f5;
      --muted: rgba(244, 244, 245, 0.56);
      --line: rgba(255, 255, 255, 0.10);
      --card: rgba(18, 18, 22, 0.72);
      --accent: #ffffff;
      --accent-text: #0a0a0c;
      --radius: 18px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: var(--bg) center / cover no-repeat fixed;
      -webkit-font-smoothing: antialiased;
    }
    /* затемнение поверх фонового изображения для читаемости */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(10, 10, 12, 0.62) 0%, rgba(10, 10, 12, 0.86) 45%, rgba(10, 10, 12, 0.96) 100%);
      z-index: -1;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; padding: 0; }

    .wrap { max-width: 560px; margin: 0 auto; padding: 28px 22px 120px; }
    h1 { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; margin: 8px 2px 22px; }
    .sub { color: var(--muted); font-size: 14px; margin: -14px 2px 22px; }

    .search {
      width: 100%;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      padding: 12px 2px;
      font-size: 16px;
      outline: none;
      margin-bottom: 26px;
    }
    .search::placeholder { color: var(--muted); }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px 16px; }
    .card { text-align: left; min-width: 0; }
    .poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: var(--radius);
      overflow: hidden;
      background: linear-gradient(145deg, #2a2a30, #121216);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.35);
    }
    .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-title { margin-top: 10px; font-size: 14px; font-weight: 550; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-meta { margin-top: 3px; font-size: 12px; color: var(--muted); }
    .card-meta.vip { color: var(--text); }

    .list { display: flex; flex-direction: column; gap: 12px; }
    .row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid var(--line);
      text-align: left;
      width: 100%;
    }
    .thumb { width: 52px; height: 74px; border-radius: 10px; overflow: hidden; flex: none; background: #1b1b20; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .row-body { min-width: 0; flex: 1; }
    .row-title { font-size: 15px; font-weight: 580; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-meta { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .tag { font-size: 13px; color: var(--text); white-space: nowrap; }

    .balance-card {
      padding: 26px 24px;
      border-radius: 24px;
      background: var(--card);
      border: 1px solid var(--line);
      margin-bottom: 22px;
    }
    .balance-label { font-size: 14px; color: var(--muted); }
    .balance-value { font-size: 48px; font-weight: 650; letter-spacing: -0.02em; margin-top: 6px; }
    .balance-unit { font-size: 16px; color: var(--muted); font-weight: 500; margin-left: 6px; }
    .pills { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 30px; }
    .pill {
      height: 56px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--card);
      font-size: 15px;
      font-weight: 580;
    }
    .section-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin: 0 2px 12px; }

    .nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
      background: rgba(10, 10, 12, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-top: 1px solid var(--line);
      z-index: 5;
    }
    .nav button { font-size: 14px; color: var(--muted); padding: 8px 0; font-weight: 550; }
    .nav button.on { color: var(--text); }

    /* карточка фильма (экран просмотра) */
    .sheet {
      position: fixed;
      inset: 0;
      background: rgba(8, 8, 10, 0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow-y: auto;
      z-index: 10;
      display: none;
    }
    .sheet.open { display: block; }
    .sheet-in { max-width: 560px; margin: 0 auto; padding: 22px 22px 60px; }
    .back { font-size: 15px; color: var(--muted); padding: 6px 0; margin-bottom: 14px; }
    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      background: #000;
      border: 1px solid var(--line);
      margin-bottom: 22px;
    }
    .player video, .player iframe { width: 100%; height: 100%; border: 0; display: block; }
    .player-empty { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; padding: 16px; text-align: center; }
    .sheet h2 { font-size: 24px; font-weight: 650; letter-spacing: -0.01em; margin: 0 0 8px; }
    .sheet .meta { color: var(--muted); font-size: 14px; margin-bottom: 26px; }
    .btn {
      width: 100%;
      height: 54px;
      border-radius: 16px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 16px;
      font-weight: 620;
    }
    .btn:disabled { opacity: 0.4; }
    .btn-ghost {
      width: 100%;
      height: 50px;
      border-radius: 16px;
      border: 1px solid var(--line);
      margin-top: 12px;
      font-size: 15px;
      font-weight: 550;
    }
    .note { margin-top: 16px; font-size: 13px; color: var(--muted); line-height: 1.5; min-height: 1em; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 96px;
      transform: translateX(-50%);
      background: rgba(30, 30, 36, 0.96);
      border: 1px solid var(--line);
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 20;
      max-width: calc(100% - 40px);
      text-align: center;
    }
    .toast.show { opacity: 1; }
    .empty { color: var(--muted); font-size: 15px; padding: 40px 0; text-align: center; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="wrap">
    <section id="view-catalog">
      <h1>Каталог</h1>
      <input id="search" class="search" type="search" placeholder="Поиск" autocomplete="off" />
      <div id="grid-catalog" class="grid"></div>
    </section>

    <section id="view-vip" class="hidden">
      <h1>VIP</h1>
      <p class="sub">Фильмы открываются за звёзды Telegram</p>
      <div id="list-vip" class="list"></div>
    </section>

    <section id="view-balance" class="hidden">
      <h1>Баланс</h1>
      <div class="balance-card">
        <div class="balance-label">Доступно</div>
        <div class="balance-value"><span id="balance">0</span><span class="balance-unit">звёзд</span></div>
      </div>
      <div class="section-title">Пополнить</div>
      <div id="topups" class="pills"></div>
      <div class="section-title">Мои фильмы</div>
      <div id="list-owned" class="list"></div>
    </section>
  </main>

  <nav class="nav">
    <button data-view="catalog" class="on" type="button">Каталог</button>
    <button data-view="vip" type="button">VIP</button>
    <button data-view="balance" type="button">Баланс</button>
  </nav>

  <div id="sheet" class="sheet">
    <div class="sheet-in">
      <button id="back" class="back" type="button">Назад</button>
      <div id="player" class="player"></div>
      <h2 id="sheet-title"></h2>
      <div id="sheet-meta" class="meta"></div>
      <button id="action" class="btn" type="button"></button>
      <button id="open-external" class="btn-ghost hidden" type="button">Открыть в браузере</button>
      <div id="note" class="note"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const initData = tg ? tg.initData : "";

  const S = { config: null, films: [], me: null, film: null, query: "", view: "catalog" };
  const $ = (id) => document.getElementById(id);

  function toast(text) {
    const t = $("toast");
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove("show"), 2600);
  }

  async function api(path, options = {}) {
    const headers = { "X-Init-Data": initData };
    if (options.body) headers["Content-Type"] = "application/json";
    const res = await fetch(path, { ...options, headers });
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    return { ok: res.ok, status: res.status, data };
  }

  const isOwned = (film) => film.price <= 0 || (S.me && S.me.owned.includes(film.id));
  const priceText = (film) => (film.price <= 0 ? "Бесплатно" : `${film.price} звёзд`);

  function posterNode(film) {
    const box = document.createElement("div");
    box.className = "poster";
    if (film.hasBanner) {
      const img = document.createElement("img");
      img.loading = "lazy";
      img.alt = "";
      img.src = `/api/banner/${film.id}`;
      box.appendChild(img);
    } else {
      box.textContent = film.title.trim().charAt(0).toUpperCase() || "";
    }
    return box;
  }

  function filmCard(film) {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "card";
    card.appendChild(posterNode(film));
    const title = document.createElement("div");
    title.className = "card-title";
    title.textContent = film.title;
    const meta = document.createElement("div");
    meta.className = "card-meta" + (film.price > 0 ? " vip" : "");
    meta.textContent = film.price > 0 && isOwned(film) ? "Открыт" : priceText(film);
    card.append(title, meta);
    card.addEventListener("click", () => openFilm(film.id));
    return card;
  }

  function filmRow(film) {
    const row = document.createElement("button");
    row.type = "button";
    row.className = "row";
    const thumb = document.createElement("div");
    thumb.className = "thumb";
    if (film.hasBanner) {
      const img = document.createElement("img");
      img.loading = "lazy";
      img.alt = "";
      img.src = `/api/banner/${film.id}`;
      thumb.appendChild(img);
    }
    const body = document.createElement("div");
    body.className = "row-body";
    const t = document.createElement("div");
    t.className = "row-title";
    t.textContent = film.title;
    const m = document.createElement("div");
    m.className = "row-meta";
    m.textContent = film.kind === "video" ? "В боте и в приложении" : "По ссылке";
    body.append(t, m);
    const tag = document.createElement("div");
    tag.className = "tag";
    tag.textContent = isOwned(film) ? "Открыт" : priceText(film);
    row.append(thumb, body, tag);
    row.addEventListener("click", () => openFilm(film.id));
    return row;
  }

  function renderCatalog() {
    const q = S.query.toLowerCase();
    const grid = $("grid-catalog");
    grid.textContent = "";
    const list = S.films.filter((f) => !q || f.title.toLowerCase().includes(q));
    if (!list.length) { grid.innerHTML = '<div class="empty">Ничего не найдено</div>'; return; }
    list.forEach((f) => grid.appendChild(filmCard(f)));
  }

  function renderVip() {
    const box = $("list-vip");
    box.textContent = "";
    const list = S.films.filter((f) => f.price > 0);
    if (!list.length) { box.innerHTML = '<div class="empty">VIP-фильмов пока нет</div>'; return; }
    list.forEach((f) => box.appendChild(filmRow(f)));
  }

  function renderBalance() {
    $("balance").textContent = S.me ? S.me.balance : "0";
    const topBox = $("topups");
    topBox.textContent = "";
    (S.config ? S.config.topups : []).forEach((n) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "pill";
      b.textContent = `${n} звёзд`;
      b.addEventListener("click", () => topUp(n));
      topBox.appendChild(b);
    });
    const owned = $("list-owned");
    owned.textContent = "";
    const list = S.films.filter((f) => S.me && S.me.owned.includes(f.id));
    if (!list.length) { owned.innerHTML = '<div class="empty">Пока ничего не куплено</div>'; return; }
    list.forEach((f) => owned.appendChild(filmRow(f)));
  }

  function showView(name) {
    S.view = name;
    ["catalog", "vip", "balance"].forEach((v) => $(`view-${v}`).classList.toggle("hidden", v !== name));
    document.querySelectorAll(".nav button").forEach((b) => b.classList.toggle("on", b.dataset.view === name));
    window.scrollTo(0, 0);
  }

  // ---------- экран фильма ----------
  function openFilm(id) {
    const film = S.films.find((f) => f.id === id);
    if (!film) return;
    S.film = film;
    $("sheet-title").textContent = film.title;
    $("sheet-meta").textContent = `${film.kind === "video" ? "Видео" : "Ссылка"} · ${priceText(film)}`;
    $("player").textContent = "";
    const empty = document.createElement("div");
    empty.className = "player-empty";
    empty.textContent = isOwned(film) ? "Нажмите «Смотреть»" : "Фильм закрыт";
    $("player").appendChild(empty);
    $("open-external").classList.add("hidden");
    $("note").textContent = "";
    $("sheet").classList.add("open");
    history.replaceState(null, "", `?film=${film.id}`);
    setAction();
  }

  function closeFilm() {
    $("sheet").classList.remove("open");
    $("player").textContent = "";
    history.replaceState(null, "", location.pathname);
    S.film = null;
  }

  function setAction() {
    const film = S.film;
    const btn = $("action");
    if (!film) return;
    if (isOwned(film)) {
      btn.textContent = "Смотреть";
      btn.disabled = false;
      btn.onclick = play;
    } else {
      btn.textContent = `Купить за ${film.price} звёзд`;
      btn.disabled = !initData;
      btn.onclick = buy;
      if (!initData) $("note").textContent = "Покупка доступна в Telegram.";
    }
  }

  async function play() {
    const film = S.film;
    if (!initData) { $("note").textContent = "Откройте приложение в Telegram, чтобы смотреть."; return; }
    const btn = $("action");
    btn.disabled = true;
    btn.textContent = "Загрузка…";
    const r = await api(`/api/films/${film.id}/play`, { method: "POST" });
    btn.disabled = false;
    btn.textContent = "Смотреть";
    if (!r.ok) {
      const msg = {
        locked: "Фильм закрыт. Откройте его за звёзды.",
        too_large: "Файл больше 20 МБ, в приложении его не открыть. Смотрите в боте.",
        media: "Не удалось загрузить видео. Попробуйте позже.",
        auth: "Откройте приложение в Telegram.",
      }[r.data && r.data.error] || "Ошибка. Попробуйте позже.";
      $("note").textContent = msg;
      return;
    }
    const box = $("player");
    box.textContent = "";
    if (r.data.kind === "video") {
      const v = document.createElement("video");
      v.controls = true;
      v.playsInline = true;
      v.preload = "metadata";
      v.src = r.data.src;
      box.appendChild(v);
    } else {
      const f = document.createElement("iframe");
      f.src = r.data.src;
      f.allow = "autoplay; fullscreen; picture-in-picture; encrypted-media";
      f.allowFullscreen = true;
      box.appendChild(f);
      $("open-external").classList.remove("hidden");
      $("open-external").onclick = () => (tg ? tg.openLink(r.data.url) : window.open(r.data.url, "_blank"));
      $("note").textContent = "Если видео не открывается здесь, откройте его в браузере.";
    }
  }

  async function buy() {
    const film = S.film;
    const btn = $("action");
    btn.disabled = true;
    const r = await api(`/api/films/${film.id}/buy`, { method: "POST" });
    if (r.ok && r.data.ok) {
      toast("Фильм открыт");
      await refreshMe();
      setAction();
      return;
    }
    if (r.ok && r.data.invoice) {
      payInvoice(r.data.invoice);
    } else {
      toast("Не удалось создать оплату");
    }
    btn.disabled = false;
  }

  async function topUp(amount) {
    if (!initData) { toast("Пополнение доступно в Telegram"); return; }
    const r = await api("/api/topup", { method: "POST", body: JSON.stringify({ amount }) });
    if (r.ok && r.data.invoice) payInvoice(r.data.invoice);
    else toast("Не удалось создать оплату");
  }

  function payInvoice(link) {
    if (!tg || !tg.openInvoice) { tg ? tg.openLink(link) : window.open(link, "_blank"); return; }
    tg.openInvoice(link, async (status) => {
      if (status === "paid") {
        toast("Оплата прошла");
        // уведомление об оплате приходит боту; подождём и обновим баланс
        for (let i = 0; i < 6; i++) {
          await new Promise((res) => setTimeout(res, 1000));
          await refreshMe();
          if (S.film) setAction();
        }
      } else if (status === "failed") {
        toast("Оплата не прошла");
      }
    });
  }

  async function refreshMe() {
    const r = await api("/api/me");
    if (r.ok) S.me = r.data;
    renderBalance();
    renderCatalog();
    renderVip();
  }

  async function loadFilms() {
    const r = await fetch("/api/films");
    S.films = r.ok ? await r.json() : [];
    renderCatalog();
    renderVip();
    renderBalance();
  }

  // ---------- события ----------
  document.querySelectorAll(".nav button").forEach((b) => b.addEventListener("click", () => showView(b.dataset.view)));
  $("search").addEventListener("input", (e) => { S.query = e.target.value.trim(); renderCatalog(); });
  $("back").addEventListener("click", closeFilm);

  (async () => {
    try {
      const cfgRes = await fetch("/api/config");
      S.config = await cfgRes.json();
      if (S.config.background) {
        document.body.style.backgroundImage = `url("${S.config.background}")`;
      }
      await loadFilms();
      if (initData) await refreshMe();
      const id = Number(new URLSearchParams(location.search).get("film"));
      if (id && S.films.some((f) => f.id === id)) openFilm(id);
    } catch (e) {
      toast("Не удалось загрузить каталог");
    }
  })();
})();
</script>
</body>
</html>
