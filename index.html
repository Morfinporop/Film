      </div>
    </div>`;
  }

  async function saveEdit(id) {
    const body = {
      title: $("#e-title").value, description: $("#e-desc").value, releaseDate: $("#e-date").value,
      creator: $("#e-creator").value, country: $("#e-country").value, isVip: $("#e-vip").checked, isActive: $("#e-active").checked,
    };
    if ($("#e-url")) body.url = $("#e-url").value;
    const r = await call(`/api/admin/films/${id}/update`, { body }).catch(() => null);
    if (r) { toast("Сохранено"); adminFilms(); }
  }

  async function addSubtitle(id) {
    const file = $(`#sub-file-${id}`).files[0];
    if (!file) { toast("Выберите файл субтитров"); return; }
    let lang = $(`#sub-lang-${id}`).value;
    if (lang === "other") {
      const code = (prompt("Код языка, например: ja, ko, zh", "ja") || "").trim().toLowerCase();
      if (!/^[a-z]{2,3}$/.test(code)) { toast("Введите код языка из двух или трёх латинских букв"); return; }
      lang = code;
    }
    const fd = new FormData();
    fd.append("lang", lang);
    fd.append("file", file, file.name);
    try {
      await upload(`/api/admin/films/${id}/subtitles`, fd, $(`#sub-progress-${id}`));
      toast("Субтитры добавлены");
      adminFilms(id);
    } catch (_) {}
  }

  // видео уходит частями по 8 МБ: каждая часть — короткий запрос с повторами при обрыве сети
  async function uploadVideoChunked(file, progressEl) {
    const init = await call("/api/admin/uploads", { body: { size: file.size, name: file.name } });
    if (progressEl) { progressEl.style.display = "block"; progressEl.firstElementChild.style.width = "0%"; }
    for (let i = 0; i < init.total; i++) {
      const start = i * init.chunkSize;
      const blob = file.slice(start, Math.min(file.size, start + init.chunkSize));
      let ok = false;
      for (let attempt = 0; attempt < 5 && !ok; attempt++) {
        try {
          const r = await fetch(`/api/admin/uploads/${init.id}/${i}`, {
            method: "PUT", headers: { "X-Init-Data": initData(), "Content-Type": "application/octet-stream" }, body: blob,
          });
          if (r.ok) ok = true;
          else if (r.status === 400 || r.status === 404 || r.status === 413) break;
        } catch (_) { /* сеть оборвалась, повторим */ }
        if (!ok) await new Promise((res) => setTimeout(res, 1500 * (attempt + 1)));
      }
      if (!ok) { toast("Загрузка прервалась. Проверьте сеть и нажмите «Добавить фильм» снова"); throw new Error("chunk"); }
      if (progressEl) progressEl.firstElementChild.style.width = Math.round(((i + 1) / init.total) * 100) + "%";
    }
    return init.id;
  }

  function uploadPoster(id, file) {
    if (!file) return;
    const fd = new FormData();
    fd.append("poster", file, file.name);
    upload(`/api/admin/films/${id}/poster`, fd, null).then(() => { toast("Обложка обновлена"); adminFilms(id); }).catch(() => {});
  }

  function upload(url, fd, progressEl) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open("POST", url);
      xhr.setRequestHeader("X-Init-Data", initData());
      if (progressEl) {
        progressEl.style.display = "block";
        progressEl.firstElementChild.style.width = "0%";
        xhr.upload.onprogress = (e) => { if (e.lengthComputable) progressEl.firstElementChild.style.width = Math.round(e.loaded / e.total * 100) + "%"; };
      }
      xhr.onload = () => {
        let data = {};
        try { data = JSON.parse(xhr.responseText); } catch (_) {}
        if (xhr.status >= 200 && xhr.status < 300) resolve(data);
        else {
          toast(xhr.status === 413 ? errText("too_large") : errText(data.error));
          reject(new Error(data.error || xhr.status));
        }
      };
      xhr.onerror = () => { toast("Сеть недоступна или соединение прервано"); reject(new Error("network")); };
      xhr.send(fd);
    });
  }

  function adminUpload() {
    $("#admin").innerHTML = `<div class="glass">
      <label class="field"><span>Тип</span>
        <select id="u-kind"><option value="video">Загрузить видео</option><option value="series">Сериал (карточка, серии добавляются потом)</option></select></label>
      <div id="u-video">
        <label class="field"><span>Видеофайл</span><input type="file" id="u-file" accept="video/*"></label>
        <p class="hint">Максимум 2 ГБ. Видео переводится в 144p, 480p и 720p. Субтитры добавляются после загрузки.</p>
      </div>
      <label class="field"><span>Название</span><input type="text" id="u-title" maxlength="120"></label>
      <label class="field"><span>Описание</span><textarea id="u-desc" maxlength="4000"></textarea></label>
      <label class="field"><span>Дата выхода</span><input type="date" id="u-date"></label>
      <label class="field"><span>Автор</span><input type="text" id="u-creator" maxlength="120"></label>
      <label class="field"><span>Страна</span><input type="text" id="u-country" maxlength="80"></label>
      <label class="field"><span>Обложка</span><input type="file" id="u-poster" accept="image/*"></label>
      <label class="check"><input type="checkbox" id="u-vip"> Фильм только для VIP</label>
      <div class="progress" id="u-progress"><div></div></div>
      <div class="row" style="margin-top:20px"><button class="btn" id="u-send">Добавить фильм</button></div>
    </div>`;
    const kind = $("#u-kind");
    kind.onchange = () => {
      $("#u-video").classList.toggle("hidden", kind.value !== "video");
      $("#u-poster").closest("label").classList.toggle("hidden", false);
    };
    $("#u-send").onclick = async () => {
      if (kind.value === "series") {
        const title = $("#u-title").value.trim();
        if (!title) { toast("Введите название сериала"); return; }
        $("#u-send").disabled = true;
        try {
          const series = await call("/api/admin/series", { body: {
            title, description: $("#u-desc").value, releaseDate: $("#u-date").value,
            creator: $("#u-creator").value, country: $("#u-country").value, isVip: $("#u-vip").checked,
          } });
          const p = $("#u-poster").files[0];
          if (p) await uploadPoster(series.id, p).catch(() => null);
          toast("Сериал создан. Теперь добавьте серии");
          go(`#/admin/film/${series.id}`);
        } catch (_) { $("#u-send").disabled = false; }
        return;
      }
      const fd = new FormData();
      fd.append("kind", kind.value);
      fd.append("title", $("#u-title").value.trim());
      fd.append("description", $("#u-desc").value);
      fd.append("releaseDate", $("#u-date").value);
      fd.append("creator", $("#u-creator").value);
      fd.append("country", $("#u-country").value);
      fd.append("isVip", $("#u-vip").checked ? "1" : "0");
      if (kind.value === "video") {
        const f = $("#u-file").files[0];
        if (!f) { toast("Выберите видеофайл"); return; }
        if (f.size > MAX_UPLOAD) { toast("Файл больше 2 ГБ"); return; }
        $("#u-send").disabled = true;
        try {
          fd.append("uploadId", await uploadVideoChunked(f, $("#u-progress")));
        } catch (_) { $("#u-send").disabled = false; return; }
      }
      const p = $("#u-poster").files[0];
      if (p) fd.append("poster", p, p.name);
      $("#u-send").disabled = true;
      try {
        const film = await upload("/api/admin/films", fd, null);
        toast("Фильм добавлен");
        go(`#/admin/film/${film.id}`);
      } catch (_) {
        $("#u-send").disabled = false;
      }
    };
  }

  function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

  function parseTime(str) {
    const m = /^(\d{1,3}):([0-5]?\d)$/.exec(String(str || "").trim());
    return m ? Number(m[1]) * 60 + Number(m[2]) : NaN;
  }

  async function adminAds() {
    const box = $("#admin");
    const list = await call("/api/admin/ads").catch(() => null);
    if (!list) { box.innerHTML = '<div class="empty">Нет доступа</div>'; return; }
    const rows = list.map((a) => `<div class="list-row">
        <div class="info"><b>${esc(fmtClock(a.startSec))}</b><small>${a.link ? esc(a.link) : "Без ссылки"}</small></div>
        <button class="btn ghost small" data-ad-del="${a.id}">Удалить</button>
      </div>`).join("");
    box.innerHTML = `<div class="glass">
      <h2>Реклама</h2>
      <p class="sub">Ролик загружается без обработки. Показывается пользователям без VIP, когда просмотр доходит до указанной минуты и секунды. Если зритель перемотал мимо, ролик включится через 10–20 секунд после места, с которого он продолжил просмотр.</p>
      <div id="ad-list">${rows || '<div class="sub" style="margin:0">Роликов пока нет</div>'}</div>
      <h2 style="margin-top:24px">Добавить ролик</h2>
      <label class="field"><span>Ролик (видео)</span><input type="file" id="adFile" accept="video/*"></label>
      <label class="field"><span>Начало показа (мм:сс)</span><input type="text" id="adTime" placeholder="10:00" maxlength="7"></label>
      <label class="field"><span>Ссылка (необязательно)</span><input type="url" id="adLinkInput" placeholder="https://" maxlength="500"></label>
      <div class="progress" id="ad-progress"><div></div></div>
      <div class="row" style="margin-top:16px"><button class="btn" id="adSave">Добавить ролик</button></div>
    </div>`;
    $("#adSave").onclick = async () => {
      const file = $("#adFile").files[0];
      const sec = parseTime($("#adTime").value);
      if (!file) { toast("Выберите видеофайл"); return; }
      if (!(sec >= 0)) { toast("Укажите время в формате мм:сс"); return; }
      if (file.size > MAX_UPLOAD) { toast("Файл больше 2 ГБ"); return; }
      const btn = $("#adSave");
      btn.disabled = true;
      try {
        const uploadId = await uploadVideoChunked(file, $("#ad-progress"));
        await call("/api/admin/ads", { body: { uploadId, startSec: sec, link: $("#adLinkInput").value.trim() } });
        toast("Ролик добавлен");
        adminAds();
      } catch (_) { btn.disabled = false; }
    };
    box.querySelectorAll("[data-ad-del]").forEach((b) => {
      b.onclick = async () => {
        b.disabled = true;
        await call(`/api/admin/ads/${b.dataset.adDel}/delete`, { body: {} }).catch(() => null);
        toast("Ролик удалён");
        adminAds();
      };
    });
  }

  async function adminUsers() {
    const box = $("#admin");
    const isOwner = S.me.isOwner;
    const roleName = { user: "Пользователь", editor: "Редактор", admin: "Админ", owner: "Владелец" };
    box.innerHTML = `<div class="row" style="margin-bottom:16px"><input type="search" id="uq" placeholder="ID, имя или @username" style="flex:1"></div>
      <div id="ulist"></div>`;
    const draw = async () => {
      const users = await call("/api/admin/users?q=" + encodeURIComponent($("#uq").value.trim())).catch(() => []);
      $("#ulist").innerHTML = users.length ? users.map((u) => {
        const roleOpts = isOwner ? ["user", "editor", "admin"] : ["user", "editor"];
        return `<div class="list-row">
          <div class="info"><b>${esc(u.name)}</b><small>${u.id} · ${roleName[u.role] || u.role} · ${u.vipActive ? "VIP до " + esc(fmtDate(u.vipUntil)) : "без VIP"}</small></div>
          ${u.role === "owner" ? "" : `<select data-role="${u.id}" style="width:auto;padding:8px 12px">${roleOpts.map((r) => `<option value="${r}" ${u.role === r ? "selected" : ""}>${roleName[r]}</option>`).join("")}</select>`}
          ${u.role === "owner" ? "" : `<button class="btn ghost small" data-vip="${u.id}" data-days="30">VIP 30</button>
          <button class="btn ghost small" data-vip="${u.id}" data-days="365">VIP 365</button>
          ${u.vipActive ? `<button class="btn danger small" data-vip="${u.id}" data-days="-30">Отозвать 30</button>` : ""}`}
        </div>`;
      }).join("") : '<div class="empty">Никого не найдено</div>';
    };
    $("#uq").addEventListener("input", debounce(draw, 300));
    box.onchange = async (e) => {
      const sel = e.target.closest("select[data-role]");
      if (!sel) return;
      await call("/api/admin/role", { body: { id: Number(sel.dataset.role), role: sel.value } }).catch(() => null);
      toast("Роль обновлена"); draw();
    };
    box.onclick = async (e) => {
      const b = e.target.closest("button[data-vip]");
      if (!b) return;
      await call("/api/admin/vip", { body: { id: Number(b.dataset.vip), days: Number(b.dataset.days) } }).catch(() => null);
      toast("Готово"); draw();
    };
    draw();
  }

  async function adminSales() {
    const box = $("#admin");
    const [stats, sales] = await Promise.all([call("/api/admin/stats").catch(() => ({})), call("/api/admin/sales").catch(() => ({ sales: [] }))]);
    const bal = stats.botBalance == null ? "нет данных" : stats.botBalance + " ★";
    box.innerHTML = `<div class="stat-grid">
        <div class="stat"><b>${bal}</b><small>Баланс бота</small></div>
        <div class="stat"><b>${stats.revenue ?? 0} ★</b><small>Всего получено</small></div>
        <div class="stat"><b>${stats.vip ?? 0}</b><small>Активных VIP</small></div>
        <div class="stat"><b>${stats.users ?? 0}</b><small>Пользователей</small></div>
        <div class="stat"><b>${stats.films ?? 0}</b><small>Фильмов</small></div>
        <div class="stat"><b>${stats.views ?? 0}</b><small>Просмотров</small></div>
      </div>
      <h2 class="section">Последние оплаты</h2>
      ${sales.sales.length ? sales.sales.map((s) => `<div class="list-row">
        <div class="info"><b>${esc(s.label)} · ${s.amount} ★</b><small>${esc(s.user)} · ${esc(fmtDate(s.date))}${s.refunded ? " · возвращено" : ""}</small></div>
        ${s.refundable ? `<button class="btn danger small" data-refund="${s.id}">Вернуть</button>` : ""}
      </div>`).join("") : '<div class="empty">Продаж пока нет</div>'}`;
    box.onclick = async (e) => {
      const b = e.target.closest("button[data-refund]");
      if (!b || !confirm("Вернуть звёзды покупателю?")) return;
      await call(`/api/admin/sales/${b.dataset.refund}/refund`, { body: {} }).catch(() => null);
      toast("Возврат выполнен"); adminSales();
    };
  }

  // ---- старт ----
  (async function boot() {
    await Promise.all([loadMe(), loadConfig()]);
    if (!location.hash) location.hash = "#/catalog";
    render();
  })();
})();
