            <button class="vp-btn stroke" id="vpSet" aria-label="Настройки" title="Настройки">${ICON.gear}</button>
            <button class="vp-btn stroke hidden" id="vpPip" aria-label="Картинка в картинке" title="Картинка в картинке">${ICON.pip}</button>
            <button class="vp-btn" id="vpFs" aria-label="Полный экран" title="Полный экран (F)">${ICON.fs}</button>
          </div>
        </div>
      </div>`;

    const vp = $("#vp"), video = $("#vid"), bar = $("#vpBar"), prog = $("#vpProg"), menu = $("#vpMenu");
    const adVid = $("#adVid"), adEl = $("#vpAd"), adSkip = $("#adSkip"), adFill = $("#adFill"), adLink = $("#adLink"), resumeBtn = $("#vpResume");
    const adWait = $("#adWait");
    const subsBox = $("#vpSubs"), flash = $("#vpFlash");
    const state = { hls: null, levels: [], menuPage: null, dragging: false, hideT: null, clickT: null, flashT: null, lastSave: 0, subTracks: [], curSub: "off",
      ad: null, adTimes: null, adIdx: 0, adPlayed: 0, adLastT: null, resumeAt: data.resumeAt || 0, viewSent: false };
    const dur = () => (isFinite(video.duration) && video.duration > 0 ? video.duration : (f.duration || 0));

    // медиа-сессия: на экране блокировки/в системных мини-плеерах тоже будет обложка фильма
    if ("mediaSession" in navigator) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: f.title,
          artwork: posterUrl ? [{ src: posterUrl, sizes: "512x512", type: "image/jpeg" }] : [],
        });
      } catch (_) {}
    }

    // ---- источник ----
    const useHls = window.Hls && Hls.isSupported();
    if (useHls) {
      const hls = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 60, capLevelToPlayerSize: false, startLevel: -1, abrEwmaDefaultEstimate: 8e6 });
      state.hls = hls;
      hls.loadSource(data.src);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        state.levels = hls.levels.map((l, i) => ({ i, h: l.height })).filter((l) => l.h).sort((a, b) => b.h - a.h);
        const want = state.levels.find((l) => l.h === prefs.quality);
        hls.currentLevel = want ? want.i : -1;
        renderMenu();
      });
      hls.on(Hls.Events.LEVEL_SWITCHED, () => { if (state.menuPage === "quality") renderMenu(); updateQualityBtn(); });
      hls.on(Hls.Events.ERROR, (_, d) => {
        if (!d.fatal) return;
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
        else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        else showError("Не удалось загрузить видео");
      });
    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
      video.src = data.src; // Safari: качество выбирает система
    } else {
      showError("Браузер не поддерживает воспроизведение");
    }

    // ---- субтитры: дорожки создаются из VTT, отображаем сами (без подложки) ----
    const subs = data.subtitles || [];
    subs.forEach((s) => {
      const t = document.createElement("track");
      t.kind = "subtitles"; t.src = s.src; t.srclang = s.lang; t.label = s.label;
      video.appendChild(t);
      if (!t.track) return; // старые браузеры без API текстовых дорожек
      t.track.mode = "hidden";
      t.track.oncuechange = () => drawCues();
      state.subTracks.push({ lang: s.lang, label: s.label, track: t.track });
    });
    if (!subs.length) $("#vpCc").classList.add("hidden");
    else $("#vpCc").classList.remove("hidden");
    function setSub(lang) {
      state.curSub = lang;
      prefs.sub = lang; savePrefs();
      state.subTracks.forEach((s) => { s.track.mode = s.lang === lang ? "hidden" : "disabled"; });
      $("#vpCc").classList.toggle("on", lang !== "off");
      if (lang === "off") subsBox.classList.remove("on");
      drawCues();
    }
    function drawCues() {
      const cur = state.subTracks.find((s) => s.lang === state.curSub);
      if (!cur || !cur.track.activeCues) { subsBox.classList.remove("on"); subsBox.textContent = ""; return; }
      const text = Array.from(cur.track.activeCues).map((c) => (c.text || "").replace(/<[^>]+>/g, "")).join("\n").trim();
      subsBox.textContent = text;
      subsBox.classList.toggle("on", !!text);
    }
    if (subs.length) setSub(subs.some((s) => s.lang === prefs.sub) ? prefs.sub : "off");

    // ---- громкость, скорость ----
    video.volume = prefs.volume; video.muted = prefs.muted;
    video.playbackRate = prefs.speed;
    setVolBar(prefs.muted ? 0 : prefs.volume);
    $("#vpSpeed").textContent = prefs.speed === 1 ? "1×" : prefs.speed + "×";
    $("#vpSpeed").classList.toggle("on", prefs.speed !== 1);

    function updateQualityBtn() { if (state.menuPage === "quality") renderMenu(); }
    function currentHeight() {
      if (state.hls && state.hls.levels && state.hls.levels[state.hls.currentLevel]) return state.hls.levels[state.hls.currentLevel].height;
      return video.videoHeight || 0;
    }
    function qualityLabel() {
      if (!state.hls) return video.videoHeight ? video.videoHeight + "p" : "Авто";
      if (state.hls.autoLevelEnabled) return "Авто" + (currentHeight() ? ` (${currentHeight()}p)` : "");
      return currentHeight() + "p";
    }

    // ---- управление ----
    function showError(text) {
      const el = $("#vpErr"); el.textContent = text; el.classList.remove("hidden");
      vp.classList.remove("loading");
    }
    function wake() {
      vp.classList.remove("idle");
      clearTimeout(state.hideT);
      if (!video.paused && !state.menuPage) state.hideT = setTimeout(() => vp.classList.add("idle"), 2600);
    }
    function togglePlay() {
      if (state.ad) return;
      if (video.ended) { video.currentTime = 0; }
      if (video.paused) video.play().catch(() => {}); else video.pause();
    }
    function flashIcon(html) {
      flash.innerHTML = html; flash.classList.add("show");
      clearTimeout(state.flashT); state.flashT = setTimeout(() => flash.classList.remove("show"), 450);
    }
    function skip(sec) {
      const d = dur();
      seekTo(video.currentTime + sec);
      const el = sec < 0 ? $("#vpSkipL") : $("#vpSkipR");
      el.textContent = (sec > 0 ? "+" : "") + sec + " сек";
      el.classList.add("show");
      clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 600);
      wake();
    }
    // заливка полосы громкости: ширина по значению, как у перемотки
    function setVolBar(v) { $("#vpVolFill").style.width = Math.round(v * 100) + "%"; }
    function setVolume(v) {
      v = Math.min(1, Math.max(0, v));
      video.volume = v;
      video.muted = v === 0;
      prefs.volume = v > 0 ? v : prefs.volume; prefs.muted = video.muted; savePrefs();
    }
    function toggleMute() { video.muted = !video.muted; prefs.muted = video.muted; savePrefs(); }
    // полноэкранный режим реализован через CSS-класс .fs (fixed на весь экран), а не
    // только через Fullscreen API: внутри Telegram WebView на телефоне этот API часто
    // недоступен (document.fullscreenEnabled === false), из-за чего кнопка раньше пропадала
    let vpHome = null, vpNext = null;
    function enterFs() {
      // выносим плеер в конец body: внутри центрированной колонки полный экран
      // на части устройств вставал со сдвигом вправо (половина кадра за экраном)
      vpHome = vp.parentNode; vpNext = vp.nextSibling;
      document.body.appendChild(vp);
      vp.classList.add("fs");
      nav.classList.add("hidden");
      document.body.style.overflow = "hidden";
      $("#vpFs").innerHTML = ICON.fsx;
      const req = vp.requestFullscreen || vp.webkitRequestFullscreen;
      if (req) { const p = req.call(vp); if (p && p.catch) p.catch(() => {}); }
    }
    function exitFs() {
      vp.classList.remove("fs");
      nav.classList.remove("hidden");
      document.body.style.overflow = "";
      $("#vpFs").innerHTML = ICON.fs;
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      if (vpHome && vpHome.isConnected) vpHome.insertBefore(vp, vpNext);
    }
    function toggleFs() { vp.classList.contains("fs") ? exitFs() : enterFs(); }
    function togglePip() {
      if (document.pictureInPictureElement) document.exitPictureInPicture().catch(() => {});
      else video.requestPictureInPicture().catch(() => {});
    }
    function setSpeed(s) {
      video.playbackRate = s; prefs.speed = s; savePrefs();
      $("#vpSpeed").textContent = s === 1 ? "1×" : s + "×";
      $("#vpSpeed").classList.toggle("on", s !== 1);
      if (state.menuPage === "speed") renderMenu();
    }

    // ---- меню настроек (как на YouTube: главное -> качество / скорость / субтитры) ----
    function openMenu(page) { state.menuPage = page; renderMenu(); vp.classList.remove("idle"); clearTimeout(state.hideT); }
    function closeMenu() { state.menuPage = null; menu.classList.add("hidden"); menu.innerHTML = ""; wake(); }
    function renderMenu() {
      if (!state.menuPage) { menu.classList.add("hidden"); return; }
      menu.classList.remove("hidden");
      const row = (act, label, value) => `<button class="vp-mrow" data-act="${act}">${label}<span class="val">${esc(value)}</span>${ICON.right}</button>`;
      const back = (title) => `<button class="vp-mrow back" data-act="back">${ICON.back}${title}</button>`;
      const opt = (act, label, on) => `<button class="vp-mrow check ${on ? "on" : ""}" data-act="${act}">${label}<span class="tick">${ICON.tick}</span></button>`;
      if (state.menuPage === "main") {
        menu.innerHTML = [
          row("quality", "Качество", state.hls ? qualityLabel() : "Авто"),
          row("speed", "Скорость", video.playbackRate === 1 ? "Обычная" : video.playbackRate + "×"),
          subs.length ? row("subs", "Субтитры", state.curSub === "off" ? "Выкл" : (state.subTracks.find((s) => s.lang === state.curSub) || {}).label || "Выкл") : "",
        ].join("");
      } else if (state.menuPage === "quality") {
        const auto = state.hls ? state.hls.autoLevelEnabled : true;
        const list = state.levels.map((l) => opt(`q:${l.h}`, `${l.h}p${l.h >= 1080 ? " · HD" : ""}`, !auto && prefs.quality === l.h));
        menu.innerHTML = back("Качество") + opt("q:auto", "Авто" + (auto && currentHeight() ? ` (${currentHeight()}p)` : ""), auto) + (list.join("") || '<div class="vp-mrow" style="color:var(--muted)">Одно качество</div>');
      } else if (state.menuPage === "speed") {
        menu.innerHTML = back("Скорость") + SPEEDS.map((s) => opt(`s:${s}`, s === 1 ? "Обычная" : s + "×", video.playbackRate === s)).join("");
      } else if (state.menuPage === "subs") {
        menu.innerHTML = back("Субтитры") + (state.subTracks.length
          ? opt("sub:off", "Выкл", state.curSub === "off") + state.subTracks.map((s) => opt(`sub:${s.lang}`, s.label, state.curSub === s.lang)).join("")
          : '<div class="vp-mrow" style="color:var(--muted);white-space:normal">У этого видео нет субтитров. Администратор может загрузить их в редактировании.</div>');
      }
    }
    // клики по панели и меню не доходят до клика по видео: меню перерисовывается во время клика
    bar.addEventListener("click", (e) => e.stopPropagation());
    menu.addEventListener("click", (e) => {
      e.stopPropagation();
      const b = e.target.closest("[data-act]");
      if (!b) return;
      const act = b.dataset.act;
      if (act === "back") return openMenu("main");
      if (act === "quality") return openMenu("quality");
      if (act === "speed") return openMenu("speed");
      if (act === "subs") return openMenu("subs");
      if (act.startsWith("q:")) {
        const v = act.slice(2);
        if (v === "auto") { prefs.quality = "auto"; if (state.hls) state.hls.currentLevel = -1; }
        else { prefs.quality = Number(v); if (state.hls) { const idx = state.levels.find((l) => l.h === Number(v)); if (idx) state.hls.currentLevel = idx.i; } }
        savePrefs(); return renderMenu();
      }
      if (act.startsWith("s:")) { setSpeed(Number(act.slice(2))); return renderMenu(); }
      if (act.startsWith("sub:")) { setSub(act.slice(4)); return renderMenu(); }
    });
    $("#vpSet").onclick = (e) => { e.stopPropagation(); state.menuPage ? closeMenu() : openMenu("main"); };
    $("#vpCc").onclick = (e) => {
      e.stopPropagation();
      if (!state.subTracks.length) { toast("У этого видео нет субтитров"); return; }
      if (state.curSub !== "off") return setSub("off");
      setSub(state.subTracks[0].lang);
    };
    $("#vpSpeed").onclick = (e) => {
      e.stopPropagation();
      const i = SPEEDS.indexOf(video.playbackRate);
      setSpeed(SPEEDS[(i + 1) % SPEEDS.length]);
    };
    $("#vpPlay").onclick = (e) => { e.stopPropagation(); togglePlay(); };
    // кнопка звука глушит и возвращает звук, а громкость двигается полосой рядом с ней
    $("#vpMute").onclick = (e) => { e.stopPropagation(); toggleMute(); wake(); };
    // полоса громкости: нажал в любом месте и тянешь, как перемотку, — на телефоне и на ПК
    const volBar = $("#vpVolFlat");
    let volDrag = false;
    const volAt = (clientX) => {
      const r = volBar.getBoundingClientRect();
      return r.width ? Math.min(1, Math.max(0, (clientX - r.left) / r.width)) : 0;
    };
    volBar.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      volDrag = true;
      try { volBar.setPointerCapture(e.pointerId); } catch (_) {}
      setVolume(volAt(e.clientX));
    });
    volBar.addEventListener("pointermove", (e) => { if (volDrag) setVolume(volAt(e.clientX)); });
    const volStop = () => { volDrag = false; };
    volBar.addEventListener("pointerup", volStop);
    volBar.addEventListener("pointercancel", volStop);
    $("#vpFs").onclick = (e) => { e.stopPropagation(); toggleFs(); };
    if (document.pictureInPictureEnabled && video.requestPictureInPicture) $("#vpPip").classList.remove("hidden");
    $("#vpPip").onclick = (e) => { e.stopPropagation(); togglePip(); };

    // ---- прогресс: перемотка мышью, пальцем и с тултипом ----
    const ratioAt = (clientX) => {
      const r = prog.getBoundingClientRect();
      const x = Number(clientX);
      if (!isFinite(x) || !r.width) return 0;
      return Math.min(1, Math.max(0, (x - r.left) / r.width));
    };
    const seekTo = (t) => {
      if (state.ad) return;
      if (!isFinite(t)) return;
      video.currentTime = Math.max(0, Math.min(t, dur() || t));
    };
    const paintProgress = (time) => {
      const d = dur() || 1;
      const pct = Math.min(100, (time / d) * 100);
      $("#vpPlayed").style.width = pct + "%";
      $("#vpKnob").style.left = pct + "%";
    };
    prog.addEventListener("pointerdown", (e) => {
      state.dragging = true; vp.classList.add("scrubbing");
      if (prog.setPointerCapture) prog.setPointerCapture(e.pointerId);
      const t = ratioAt(e.clientX) * dur();
      seekTo(t); paintProgress(t); wake();
    });
    prog.addEventListener("pointermove", (e) => {
      const ratio = ratioAt(e.clientX);
      const tip = $("#vpTip");
      tip.textContent = fmtClock(ratio * dur());
      tip.style.left = (ratio * 100) + "%";
      if (state.dragging) { const t = ratio * dur(); seekTo(t); paintProgress(t); }
    });
    const endDrag = () => { state.dragging = false; vp.classList.remove("scrubbing"); };
    prog.addEventListener("pointerup", endDrag);
    prog.addEventListener("pointercancel", endDrag);

    // ---- события видео ----
    const paintTime = () => {
      $("#vpTime").textContent = `${fmtClock(video.currentTime)} / ${fmtClock(dur())}`;
      if (!state.dragging) paintProgress(video.currentTime);
    };
    video.addEventListener("loadedmetadata", () => {
      vp.classList.remove("loading");
      const saved = Number(localStorage.getItem("pos:" + f.id) || 0);
      if (saved > 5 && saved < dur() - 15) {
        video.currentTime = saved;
        toast("Продолжено с " + fmtClock(saved));
      }
      paintTime();
    });
    video.addEventListener("timeupdate", () => {
      paintTime();
      const now = Date.now();
      if (now - state.lastSave > 3000 && video.currentTime > 5) {
        state.lastSave = now;
        try { localStorage.setItem("pos:" + f.id, String(Math.floor(video.currentTime))); } catch (_) {}
      }
    });
    video.addEventListener("progress", () => {
      const d = dur() || 1; const b = video.buffered;
      let end = 0;
      for (let i = 0; i < b.length; i++) if (b.start(i) <= video.currentTime + 0.5 && b.end(i) > end) end = b.end(i);
      $("#vpBuf").style.width = Math.min(100, (end / d) * 100) + "%";
    });
    video.addEventListener("play", () => { vp.classList.remove("loading"); $("#vpPlay").innerHTML = ICON.pause; $("#vpPlay").setAttribute("aria-label", "Пауза"); wake(); });
    video.addEventListener("pause", () => { $("#vpPlay").innerHTML = ICON.play; $("#vpPlay").setAttribute("aria-label", "Воспроизвести"); vp.classList.remove("idle"); clearTimeout(state.hideT); });
    video.addEventListener("ended", () => {
      $("#vpPlay").innerHTML = ICON.replay; vp.classList.remove("idle");
      try { localStorage.removeItem("pos:" + f.id); } catch (_) {}
      sendComplete();   // короткий ролик досмотрен — просмотр тоже засчитывается
    });
    // Просмотр засчитывается, когда зритель посмотрел 5 минут: в конце титры и субтитры,
    // их смотрят не все. Решает сервер по позиции, он же не даёт накрутить повторно.
    function sendComplete() {
      if (state.viewSent || state.ad) return;
      state.viewSent = true;
      fetch(`/api/films/${f.id}/complete`, {
        method: "POST",
        headers: { "X-Init-Data": initData(), "Content-Type": "application/json" },
        body: JSON.stringify({ position: video.currentTime, duration: dur() }),
      }).catch(() => {});
    }
    video.addEventListener("timeupdate", () => {
      if (!state.viewSent && video.currentTime >= VIEW_MIN_SEC) sendComplete();
    });
    video.addEventListener("waiting", () => vp.classList.add("loading"));
    video.addEventListener("playing", () => vp.classList.remove("loading"));
    video.addEventListener("canplay", () => vp.classList.remove("loading"));
    video.addEventListener("volumechange", () => {
      const v = video.muted ? 0 : video.volume;
      setVolBar(v);
      $("#vpMute").innerHTML = v === 0 ? ICON.mute : ICON.vol;
    });
    video.addEventListener("error", () => { if (!state.hls && video.error) showError("Не удалось загрузить видео"); });

    // ---- продолжение просмотра: кнопка по центру, без подложки ----
    if (state.resumeAt > 0) resumeBtn.textContent = `Продолжить на ${fmtClock(state.resumeAt)}`;
    else resumeBtn.classList.add("hidden");
    resumeBtn.onclick = (e) => {
      e.stopPropagation();
      const at = state.resumeAt; state.resumeAt = 0;
      resumeBtn.classList.add("hidden");
      video.currentTime = at;
      video.play().catch(() => {});
    };
    video.addEventListener("play", () => resumeBtn.classList.add("hidden"));

    // ---- сохранение позиции на сервере (раз в 10 с, на паузе и при уходе) ----
    const saveProgress = () => {
      const d = dur();
      if (state.ad || !d || !isFinite(video.currentTime) || video.currentTime <= 0) return;
      fetch(`/api/films/${f.id}/progress`, {
        method: "POST", keepalive: true,
        headers: { "X-Init-Data": initData(), "Content-Type": "application/json" },
        body: JSON.stringify({ position: video.currentTime, duration: d }),
      }).catch(() => {});
    };
    const saveTimer = setInterval(() => { if (!video.paused) saveProgress(); }, 10000);
    video.addEventListener("pause", saveProgress);
    video.addEventListener("ended", saveProgress);
    window.addEventListener("pagehide", saveProgress);

    // ---- реклама (только без VIP): ролик стартует у своей отметки; при перемотке через отметку сдвигается на 10-20 с после места продолжения ----
    // VIP-пользователю рекламный блок даже не создаётся
    const isVip = !!(S.me && S.me.vipActive);
    const adList = isVip ? [] : (data.ads || []).map((a) => ({ ...a, shown: false }));
    if (isVip) adEl.remove();
    state.lastT = 0;
    function startAd(a) {
      a.shown = true;
      state.ad = { back: video.currentTime, link: a.link || "" };
      video.pause();
      vp.classList.add("ad-on");
      resumeBtn.classList.add("hidden");
      adEl.classList.remove("hidden");
      adSkip.classList.add("hidden");
      adFill.style.width = "0%";
      adLink.disabled = !a.link;
      // отсчёт идёт только пока ролик правда играет: на плохом интернете он буферизуется,
      // и эти секунды не засчитываются — пропустить раньше времени не выйдет
      state.adPlayed = 0; state.adLastT = null;
      adWait.textContent = "Пропуск через: " + AD_SKIP_SEC;
      adWait.classList.remove("hidden");
      adVid.src = a.src;
      const go = () => adVid.play().catch(() => { adVid.muted = true; adVid.play().catch(() => endAd()); });
      go();
    }
    function endAd() {
      if (!state.ad) return;
      const back = state.ad.back;
      state.ad = null;
      adWait.classList.add("hidden");
      adVid.pause();
      adEl.classList.add("hidden");
      vp.classList.remove("ad-on");
      state.lastT = back;
      video.currentTime = back;
      video.play().catch(() => {});
    }
    function checkAds() {
      if (state.ad || video.seeking) return;
      const t = video.currentTime;
      const a = adList.find((x) => !x.shown && x.at <= t);
      if (a) startAd(a);
    }
    if (adList.length) {
      adLink.onclick = (e) => {
        e.stopPropagation();
        const l = state.ad && state.ad.link;
        if (!l) return;
        const twa = tg();
        if (twa && twa.openLink) twa.openLink(l); else window.open(l, "_blank", "noopener");
      };
      adSkip.onclick = (e) => { e.stopPropagation(); endAd(); };
      adVid.addEventListener("ended", endAd);
      adVid.addEventListener("error", () => { if (state.ad) endAd(); });
      adVid.addEventListener("timeupdate", () => {
        if (adVid.duration) adFill.style.width = (adVid.currentTime / adVid.duration * 100) + "%";
        if (state.ad && !adVid.paused) {
          const t = adVid.currentTime;
          if (state.adLastT !== null && t > state.adLastT) state.adPlayed += t - state.adLastT;
          state.adLastT = t;
          const left = Math.ceil(AD_SKIP_SEC - state.adPlayed);
          if (left > 0) adWait.textContent = "Пропуск через: " + left;
          else { adWait.classList.add("hidden"); adSkip.classList.remove("hidden"); }
        }
      });
      video.addEventListener("timeupdate", () => {
        if (video.seeking) return;
        state.lastT = video.currentTime;
        checkAds();
      });
      // перемотка вперёд через отметку ролика: ролик переносится на место продолжения + 10..20 с
      video.addEventListener("seeked", () => {
        const from = state.lastT, to = video.currentTime;
        state.lastT = to;
        if (state.ad || to <= from + 2) return;
        for (const a of adList) {
          if (!a.shown && a.at > from && a.at <= to) a.at = to + 10 + Math.random() * 10;
        }
        checkAds();
      });
    }
    const onFs = () => {
      // если Fullscreen API сам вышел (например, системной кнопкой), синхронизируем наш CSS-режим
      if (!document.fullscreenElement && vp.classList.contains("fs")) exitFs();
    };
    document.addEventListener("fullscreenchange", onFs);

    // клик по видео: пауза/воспроизведение, двойной клик: полный экран
    vp.addEventListener("click", (e) => {
      if (state.ad || e.target.closest(".vp-resume")) return;
      if (e.target.closest(".vp-bar, .vp-menu")) return;
      if (state.menuPage) { closeMenu(); return; }
      wake();
      clearTimeout(state.clickT);
      state.clickT = setTimeout(() => { togglePlay(); flashIcon(video.paused ? ICON.pause : ICON.play); }, 210);
    });
    vp.addEventListener("dblclick", (e) => {
      if (e.target.closest(".vp-bar, .vp-menu")) return;
      clearTimeout(state.clickT);
      const x = e.clientX - vp.getBoundingClientRect().left;
      if (x < vp.clientWidth * 0.35) skip(-10);
      else if (x > vp.clientWidth * 0.65) skip(10);
      else toggleFs();
    });
    vp.addEventListener("pointermove", wake);
    vp.addEventListener("touchstart", wake, { passive: true });
    vp.addEventListener("mouseleave", () => { if (!video.paused && !state.menuPage) vp.classList.add("idle"); });

    // клавиатура: когда плеер в фокусе. Смотрим на e.code — физическую клавишу,
    // поэтому горячие клавиши работают и с русской раскладкой (F = А, M = Ь и т.д.)
    vp.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT") return;
      const c = e.code || "";
      if (state.ad && c !== "Escape") { e.preventDefault(); return; }
      let handled = true;
      if (c === "Space" || c === "KeyK") togglePlay();
      else if (c === "ArrowRight") skip(5);
      else if (c === "ArrowLeft") skip(-5);
      else if (c === "KeyL") skip(10);
      else if (c === "KeyJ") skip(-10);
      else if (c === "ArrowUp") setVolume(video.volume + 0.05);
      else if (c === "ArrowDown") setVolume(video.volume - 0.05);
      else if (c === "KeyM") toggleMute();
      else if (c === "KeyF") toggleFs();
      else if (c === "KeyC") $("#vpCc").click();
      else if (c === "KeyP") togglePip();
      else if (c === "Period") setSpeed(SPEEDS[Math.min(SPEEDS.length - 1, SPEEDS.indexOf(video.playbackRate) + 1)] || 2);
      else if (c === "Comma") setSpeed(SPEEDS[Math.max(0, SPEEDS.indexOf(video.playbackRate) - 1)] || 0.25);
      else if (/^Digit[0-9]$/.test(c)) { if (dur()) seekTo((Number(c.slice(5)) / 10) * dur()); }
      else if (c === "Escape") { if (state.menuPage) closeMenu(); else if (vp.classList.contains("fs")) exitFs(); }
      else handled = false;
      if (handled) { e.preventDefault(); wake(); }
    });

    wake();
    return {
      destroy() {
        clearTimeout(state.hideT); clearTimeout(state.clickT); clearTimeout(state.flashT);
        clearInterval(saveTimer);
        saveProgress();
        window.removeEventListener("pagehide", saveProgress);
        document.removeEventListener("fullscreenchange", onFs);
        if (state.hls) { try { state.hls.destroy(); } catch (_) {} }
        video.pause(); video.removeAttribute("src"); video.load();
        exitFs();
      },
    };
  }

      </div>
      ${t.closed
        ? '<p class="sub" style="margin:0 0 118px">Тикет закрыт. Через 10 минут он удалится.</p>'
        : `<div class="tk-dock">
        <div class="tk-pick hidden" id="tkPick">
          <img id="tkPickImg" alt="Картинка к сообщению">
          <button id="tkPickX" aria-label="Убрать картинку" title="Убрать картинку">&times;</button>
        </div>
        <div class="tk-input">
          <button class="tk-clip" id="tkClip" aria-label="Прикрепить картинку" title="Прикрепить картинку">${TK_CLIP}</button>
          <textarea id="tkReply" rows="1" maxlength="2000" placeholder="Сообщение"></textarea>
          <button class="tk-go" id="tkSendMsg" aria-label="Отправить" title="Отправить">${TK_SEND}</button>
        </div>
      </div>`}`;
    const msgs = $("#tkMsgs");
    const toBottom = () => window.scrollTo({ top: document.body.scrollHeight });
    toBottom();

    // кнопки действий привязываются и к закрытому тикету: закрыл — потом можно удалить сразу
    const cl = $("#tkClose");
    if (cl) cl.onclick = async () => {
      if (!confirm("Закрыть тикет? Он закроется у обеих сторон и через 10 минут удалится.")) return;
      await call(`/api/tickets/${t.id}/close`, { body: {} }).catch(() => null);
      toast("Тикет закрыт");
      go("#/support");
    };
    const up = $("#tkUp"), down = $("#tkDown"), del = $("#tkDel");
    if (up) up.onclick = async () => {
      await call(`/api/tickets/${t.id}/transfer`, { body: { to: "staff" } }).catch(() => null);
      toast("Тикет передан админам");
      go("#/support");
    };
    if (down) down.onclick = async () => {
      await call(`/api/tickets/${t.id}/transfer`, { body: { to: "operator" } }).catch(() => null);
      toast("Тикет возвращён операторам");
      go("#/support");
    };
    // «Удалить» стирает тикет из базы сразу, вместе с перепиской и картинками
    if (del) del.onclick = async () => {
      if (!confirm("Удалить тикет сейчас? Он удалится сразу, вместе с перепиской.")) return;
      const r = await api(`/api/tickets/${t.id}/delete`, { body: {} });
      if (!r.ok) { toast(errText(r.data.error)); return; }
      toast("Тикет удалён");
      go("#/support");
    };

    if (t.closed) return;   // у закрытого тикета нет поля ввода и скрепки

    const pick = $("#tkPick"), box = $("#tkReply");

    // Картинка читается в base64 и ждёт отправки в памяти: чуть выше поля ввода видно,
    // что именно уйдёт, а крестик убирает её до отправки. На сервер она уходит только
    // вместе с сообщением, поэтому лишних файлов в тикете не остаётся.
    let shot = null;
    const dropShot = () => {
      shot = null;
      pick.classList.add("hidden");
      $("#tkPickImg").removeAttribute("src");
    };
    const takeShot = (file) => {
      if (!file) return;
      if (!/^image\//.test(file.type)) { toast("Можно прикрепить только картинку"); return; }
      const fr = new FileReader();
      fr.onload = () => {
        shot = String(fr.result);
        $("#tkPickImg").src = shot;
        pick.classList.remove("hidden");
      };
      fr.onerror = () => toast("Не удалось прочитать картинку");
      fr.readAsDataURL(file);
    };
    $("#tkClip").onclick = () => {
      const inp = document.createElement("input");
      inp.type = "file";
      inp.accept = "image/*";
      inp.onchange = () => takeShot(inp.files && inp.files[0]);
      inp.click();
    };
    $("#tkPickX").onclick = dropShot;
    box.addEventListener("paste", (e) => {
      const item = [...(e.clipboardData && e.clipboardData.items || [])].find((i) => i.type.startsWith("image/"));
      if (item) { e.preventDefault(); takeShot(item.getAsFile()); }
    });

    const send = async () => {
      const text = box.value.trim();
      if (!text && !shot) return;
      let image = null;
      if (shot) {                                    // base64 уходит отдельным запросом
        const upl = await api(`/api/tickets/${t.id}/images`, { body: { image: shot } });
        if (!upl.ok) { toast(errText(upl.data.error)); return; }
        image = upl.data.name;
      }
      const r = await api(`/api/tickets/${t.id}/messages`, { body: { text, image } });
      if (!r.ok) {
        toast(r.data.error === "user_left" ? "Пользователь ушёл из бота, тикет удалён" : errText(r.data.error));
        if (r.data.error === "user_left") return go("#/support");
        return;
      }
      // добавляем только новое сообщение: экран не перерисовывается целиком
      box.value = "";
      dropShot();
      t.messages.push(r.data.message);
      msgs.insertAdjacentHTML("beforeend", tkMsgHtml(t, r.data.message));
      toBottom();
    };
    $("#tkSendMsg").onclick = send;
    box.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
  }

  // видео уходит частями (размер приходит с сервера, 2 МБ): каждая часть — короткий запрос
  // с повторами при обрыве сети; между частями короткая передышка, чтобы компьютер
  // и канал не были забиты непрерывной отдачей
  async function uploadVideoChunked(file, progressEl) {
    const init = await call("/api/admin/uploads", { body: { size: file.size, name: file.name } });
    if (progressEl) { progressEl.style.display = "block"; progressEl.firstElementChild.style.width = "0%"; }
    for (let i = 0; i < init.total; i++) {
      const start = i * init.chunkSize;
      const blob = file.slice(start, Math.min(file.size, start + init.chunkSize));
      let ok = false;
      for (let attempt = 0; attempt < 5 && !ok; attempt++) {
        try {
          const r = await fetch(`/api/admin/uploads/${init.id}/${i}`, {
            method: "PUT", headers: { "X-Init-Data": initData(), "Content-Type": "application/octet-stream" }, body: blob,
          });
          if (r.ok) ok = true;
          else if (r.status === 400 || r.status === 404 || r.status === 413) break;
        } catch (_) { /* сеть оборвалась, повторим */ }
        if (!ok) await new Promise((res) => setTimeout(res, 1500 * (attempt + 1)));
      }
      if (!ok) { toast("Загрузка прервалась. Проверьте сеть и нажмите «Добавить» снова"); throw new Error("chunk"); }
      if (progressEl) progressEl.firstElementChild.style.width = Math.round(((i + 1) / init.total) * 100) + "%";
      await new Promise((res) => setTimeout(res, 50));   // передышка между частями
    }
    return init.id;
  }

  function uploadPoster(id, file) {

    upload(`/api/admin/films/${id}/poster`, fd, null).then(() => { toast("Обложка обновлена"); adminFilms(id); }).catch(() => {});
  }

  function upload(url, fd, progressEl) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open("POST", url);
      xhr.setRequestHeader("X-Init-Data", initData());
      if (progressEl) {
        progressEl.style.display = "block";
        progressEl.firstElementChild.style.width = "0%";
        xhr.upload.onprogress = (e) => { if (e.lengthComputable) progressEl.firstElementChild.style.width = Math.round(e.loaded / e.total * 100) + "%"; };
      }
      xhr.onload = () => {
        let data = {};
        try { data = JSON.parse(xhr.responseText); } catch (_) {}
        if (xhr.status >= 200 && xhr.status < 300) resolve(data);
        else {
          toast(xhr.status === 413 ? errText("too_large") : errText(data.error));
          reject(new Error(data.error || xhr.status));
        }
      };
      xhr.onerror = () => { toast("Сеть недоступна или соединение прервано"); reject(new Error("network")); };
      xhr.send(fd);
    });
  }

      <div class="glass adm-card">
        <h2>Что добавляем</h2>
        <label class="field"><span>Тип</span>
          <select id="u-kind"><option value="video">Загрузить видео</option><option value="series">Сериал (карточка, серии добавляются потом)</option></select></label>
        <div id="u-video">
          <label class="field"><span>Видеофайлы</span><input type="file" id="u-file" accept="video/*" multiple></label>
          <p class="hint">Можно выбрать сразу несколько: они загружаются по очереди, по одному —
          без ошибок и без нагрузки на компьютер. Максимум 2 ГБ на файл. Собираются два качества —
          240p и 720p; видео открывается, когда готовы оба.</p>
          <div class="progress" id="u-progress"><div></div></div>
          <p class="hint" id="u-prognote" style="margin-top:6px"></p>
        </div>
      </div>
      <div class="glass adm-card">
        <h2>Основное</h2>
        <label class="field"><span>Название</span><input type="text" id="u-title" maxlength="120"></label>
        <label class="field"><span>Описание</span><textarea id="u-desc" maxlength="4000"></textarea></label>
        <div class="adm-grid">
          <label class="field"><span>Дата выхода</span><input type="date" id="u-date"></label>
          <label class="field"><span>Автор</span><input type="text" id="u-creator" maxlength="120"></label>
          <label class="field"><span>Страна</span><input type="text" id="u-country" maxlength="80"></label>
          <label class="field"><span>Жанр</span>
            <select id="u-genre">
              <option value="anime" selected>Аниме</option>
              <option value="cartoon">Мультфильмы</option>
            </select>
          </label>
        </div>
        <p class="hint" style="margin:0">Жанр показывается на карточке в каталоге и рядом с названием.</p>
      </div>
      <div class="glass adm-card">
        <h2>Обложка и доступ</h2>
        <label class="field"><span>Обложка</span><input type="file" id="u-poster" accept="image/*"></label>
        <label class="check" style="margin:0"><input type="checkbox" id="u-vip"> Только для VIP</label>
      </div>
      <div class="row" style="margin-top:20px"><button class="btn" id="u-send">Добавить</button></div>`;
    const kind = $("#u-kind");
    kind.onchange = () => {
      $("#u-video").classList.toggle("hidden", kind.value !== "video");
    };
    $("#u-send").onclick = async () => {
      if (kind.value === "series") {
        const title = $("#u-title").value.trim();
        if (!title) { toast("Введите название сериала"); return; }
        $("#u-send").disabled = true;
        try {
          const series = await call("/api/admin/series", { body: {
            title, description: $("#u-desc").value, releaseDate: $("#u-date").value,
            creator: $("#u-creator").value, country: $("#u-country").value, isVip: $("#u-vip").checked,
            genre: $("#u-genre").value,
          } });
          const p = $("#u-poster").files[0];
          if (p) await uploadPoster(series.id, p).catch(() => null);
          toast("Сериал создан. Теперь добавьте серии");
          go(`#/admin/film/${series.id}`);
        } catch (_) { $("#u-send").disabled = false; }
        return;
      }
      // несколько видео уходят в очередь по одному: без параллельной отдачи нет
      // ни обрывов, ни нагрузки на компьютер, а сервер и так обрабатывает по одному
      const files = [...$("#u-file").files];
      if (kind.value === "video" && !files.length) { toast("Выберите видеофайл"); return; }
      for (const f of files) if (f.size > MAX_UPLOAD) { toast(`«${f.name}» больше 2 ГБ`); return; }
      const note = $("#u-prognote");
      $("#u-send").disabled = true;
      let last = null, done = 0;
      try {
        for (const f of files) {
          const fd = new FormData();
          fd.append("kind", kind.value);
          // один файл — название из поля; несколько — из имени файла, поправится в редакторе
          fd.append("title", files.length === 1 && $("#u-title").value.trim()
            ? $("#u-title").value.trim() : f.name.replace(/\.[^.]+$/, ""));
          fd.append("description", $("#u-desc").value);
          fd.append("releaseDate", $("#u-date").value);
          fd.append("creator", $("#u-creator").value);
          fd.append("country", $("#u-country").value);
          fd.append("genre", $("#u-genre").value);
          fd.append("isVip", $("#u-vip").checked ? "1" : "0");
          if (note) note.textContent = `Файл ${done + 1} из ${files.length}: ${f.name}`;
          fd.append("uploadId", await uploadVideoChunked(f, $("#u-progress")));
          const p = files.length === 1 ? $("#u-poster").files[0] : null;
          if (p) fd.append("poster", p, p.name);
          last = await upload("/api/admin/films", fd, null);
          done++;
        }
        toast(done === 1 ? "Добавлено" : `Добавлено фильмов: ${done}`);
        go(`#/admin/film/${last.id}`);
      } catch (_) {
        $("#u-send").disabled = false;
      }
    };
  }

  function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

  function parseTime(str) {
    const m = /^(\d{1,3}):([0-5]?\d)$/.exec(String(str || "").trim());
    return m ? Number(m[1]) * 60 + Number(m[2]) : NaN;
  }

  async function adminAds() {
    const box = $("#admin");
    const list = await call("/api/admin/ads").catch(() => null);
    if (!list) { box.innerHTML = '<div class="empty">Нет доступа</div>'; return; }
    const rows = list.map((a) => `<div class="list-row">
        <div class="info"><b>${esc(fmtClock(a.startSec))}</b><small>${a.link ? esc(a.link) : "Без ссылки"}</small></div>
        <button class="btn ghost small" data-ad-del="${a.id}">Удалить</button>
      </div>`).join("");
    box.innerHTML = `<div class="glass adm-card">
      <h2>Реклама<small>Ролик загружается без обработки. Показывается пользователям без VIP-доступа (персонал и реальные VIP-подписчики рекламу не видят), когда просмотр доходит до указанной минуты и секунды. Если зритель перемотал мимо, ролик включится через 10–20 секунд после места, с которого он продолжил просмотр.</small></h2>
      <div id="ad-list">${rows || '<div class="sub" style="margin:0">Роликов пока нет</div>'}</div>
    </div>
    <div class="glass adm-card">
      <h2>Добавить ролик</h2>
      <label class="field"><span>Ролик (видео)</span><input type="file" id="adFile" accept="video/*"></label>
      <label class="field"><span>Начало показа (мм:сс)</span><input type="text" id="adTime" placeholder="10:00" maxlength="7"></label>
      <label class="field"><span>Ссылка (необязательно)</span><input type="url" id="adLinkInput" placeholder="https://" maxlength="500"></label>
      <div class="progress" id="ad-progress"><div></div></div>
      <div class="row" style="margin-top:16px"><button class="btn" id="adSave">Добавить ролик</button></div>
    </div>`;
    $("#adSave").onclick = async () => {
      const file = $("#adFile").files[0];
      const sec = parseTime($("#adTime").value);
      if (!file) { toast("Выберите видеофайл"); return; }
      if (!(sec >= 0)) { toast("Укажите время в формате мм:сс"); return; }
      if (file.size > MAX_UPLOAD) { toast("Файл больше 2 ГБ"); return; }
      const btn = $("#adSave");
      btn.disabled = true;
      try {
        const uploadId = await uploadVideoChunked(file, $("#ad-progress"));
        await call("/api/admin/ads", { body: { uploadId, startSec: sec, link: $("#adLinkInput").value.trim() } });
        toast("Ролик добавлен");
        adminAds();
      } catch (_) { btn.disabled = false; }
    };
    box.querySelectorAll("[data-ad-del]").forEach((b) => {
      b.onclick = async () => {
        b.disabled = true;
        await call(`/api/admin/ads/${b.dataset.adDel}/delete`, { body: {} }).catch(() => null);
        toast("Ролик удалён");
        adminAds();
      };
    });
  }

  async function adminUsers() {
    const box = $("#admin");
    const isOwner = S.me.isOwner;
    const roleName = { user: "Пользователь", operator: "Оператор", editor: "Редактор", admin: "Админ", owner: "Владелец" };
    // звёзды начисляются прямо в строке пользователя: поле суммы и кнопка «Начислить»
    box.innerHTML = `<div class="row" style="margin-bottom:16px"><input type="search" id="uq" placeholder="ID, имя или @username" style="flex:1"></div>
      <div id="ulist"></div>`;
    const draw = async () => {
      const users = await call("/api/admin/users?q=" + encodeURIComponent($("#uq").value.trim())).catch(() => []);
      $("#ulist").innerHTML = users.length ? users.map((u) => {
        const roleOpts = isOwner ? ["user", "operator", "editor", "admin"] : ["user", "operator", "editor"];
        const vipPill = u.vipForever
          ? `<span class="pill">VIP <span class="vip-infinity">∞</span></span>`
          : u.vipActive ? `<span class="pill">VIP до ${esc(fmtDate(u.vipUntil))}</span>` : "";
        return `<div class="list-row" style="flex-direction:column;align-items:stretch">
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:100%">
            <div class="info" style="flex:1"><b>${esc(u.name)}</b><small>ID ${u.id}</small></div>
            <span class="row" style="gap:6px;flex-wrap:wrap">
              <span class="pill">${roleName[u.role] || u.role}</span>${vipPill}<span class="pill">${u.stars || 0} ★</span>
              ${u.banned ? '<span class="pill bad">Забанен</span>' : ""}
            </span>
          </div>
          ${u.role === "owner" ? "" : `
          <div class="adm-sec"><h3>Роль</h3>
            <select data-role="${u.id}" style="max-width:220px">${roleOpts.map((r) => `<option value="${r}" ${u.role === r ? "selected" : ""}>${roleName[r]}</option>`).join("")}</select>
          </div>
          <div class="adm-sec"><h3>VIP</h3>
            <span class="row" style="gap:6px;flex-wrap:wrap">
              <button class="btn ghost small" data-vip="${u.id}" data-days="1">1 день</button>
              <button class="btn ghost small" data-vip="${u.id}" data-days="30">30 дней</button>
              <button class="btn ghost small" data-vip="${u.id}" data-days="365">365 дней</button>
              <button class="btn ghost small" data-vip-forever="${u.id}">Навсегда ∞</button>
              ${u.vipActive ? `<button class="btn danger small" data-vip-revoke="${u.id}">Снять VIP</button>` : ""}
            </span>
          </div>
          <div class="adm-sec"><h3>Звёзды</h3>
            <span class="row" style="gap:6px">
              <input type="number" data-star-id="${u.id}" placeholder="Сумма (минус — списание)" style="width:190px" min="-1000000" max="1000000">
              <button class="btn ghost small" data-stars="${u.id}">Начислить</button>
            </span>
          </div>
          <div class="adm-sec"><h3>Доступ</h3>
            ${u.banned ? `<button class="btn small" data-unban="${u.id}">Разбанить</button>`
                       : `<button class="btn danger small" data-ban="${u.id}">Забанить</button>`}
          </div>`}
        </div>`;
      }).join("") : '<div class="empty">Никого не найдено</div>';
    };
    $("#uq").addEventListener("input", debounce(draw, 300));
    box.onchange = async (e) => {
      const sel = e.target.closest("select[data-role]");
      if (!sel) return;
      await call("/api/admin/role", { body: { id: Number(sel.dataset.role), role: sel.value } }).catch(() => null);
      toast("Роль обновлена"); draw();
    };
    box.onclick = async (e) => {
      const b = e.target.closest("button[data-vip],button[data-vip-forever],button[data-vip-revoke],button[data-stars],button[data-ban],button[data-unban]");
      if (!b) return;
      if (b.dataset.ban || b.dataset.unban) {
        const id = Number(b.dataset.ban || b.dataset.unban);
        const ban = !!b.dataset.ban;
        if (ban && !confirm("Забанить пользователя? Ему будет закрыт весь сайт, кроме поддержки.")) return;
        await call("/api/admin/ban", { body: { id, banned: ban } }).catch(() => null);
        toast(ban ? "Пользователь забанен" : "Бан снят");
        return draw();
      }
      if (b.dataset.vip) {
        await call("/api/admin/vip", { body: { id: Number(b.dataset.vip), days: Number(b.dataset.days) } }).catch(() => null);
        toast("Готово"); draw();
      } else if (b.dataset.vipForever) {
        await call("/api/admin/vip", { body: { id: Number(b.dataset.vipForever), forever: true } }).catch(() => null);
        toast("VIP выдан навсегда"); draw();
      } else if (b.dataset.vipRevoke) {
        await call("/api/admin/vip", { body: { id: Number(b.dataset.vipRevoke), revoke: true } }).catch(() => null);
        toast("VIP снят"); draw();
      } else if (b.dataset.stars) {
        const inp = box.querySelector(`input[data-star-id="${b.dataset.stars}"]`);
        const amount = Number(inp && inp.value);
        if (!amount) { toast("Укажите сумму (можно минус)"); return; }
        const r = await api("/api/admin/stars", { body: { id: Number(b.dataset.stars), amount } });
        if (!r.ok) { toast(errText(r.data.error)); return; }
        toast(`Баланс: ${r.data.stars} ★`); draw();
      }
    };
    draw();
  }

  async function adminSales() {
    const box = $("#admin");
    const [stats, sales] = await Promise.all([call("/api/admin/stats").catch(() => ({})), call("/api/admin/sales").catch(() => ({ sales: [] }))]);
    const bal = stats.botBalance == null ? "нет данных" : stats.botBalance + " ★";
    box.innerHTML = `<div class="glass adm-card"><h2>Показатели</h2><div class="stat-grid">
        <div class="stat"><b>${bal}</b><small>Баланс бота</small></div>
        <div class="stat"><b>${stats.revenue ?? 0} ★</b><small>Всего получено</small></div>
        <div class="stat"><b>${stats.vip ?? 0}</b><small>Активных VIP</small></div>
        <div class="stat"><b>${stats.users ?? 0}</b><small>Пользователей</small></div>
        <div class="stat"><b>${stats.films ?? 0}</b><small>В каталоге</small></div>
        <div class="stat"><b>${stats.views ?? 0}</b><small>Просмотров</small></div>
      </div></div>
      <div class="glass adm-card"><h2>Последние оплаты</h2>
      ${sales.sales.length ? sales.sales.map((s) => `<div class="list-row">
        <div class="info"><b>${esc(s.label)} · ${s.amount} ★</b><small>${esc(s.user)} · ${esc(fmtDate(s.date))}${s.refunded ? " · возвращено" : ""}</small></div>
        ${s.refundable ? `<button class="btn danger small" data-refund="${s.id}">Вернуть</button>` : ""}
      </div>`).join("") : '<div class="empty">Продаж пока нет</div>'}</div>`;
    box.onclick = async (e) => {
      const b = e.target.closest("button[data-refund]");
      if (!b || !confirm("Вернуть звёзды покупателю?")) return;
      await call(`/api/admin/sales/${b.dataset.refund}/refund`, { body: {} }).catch(() => null);
      toast("Возврат выполнен"); adminSales();
    };
  }

  // ---- подсказки при первом входе ----
  // Экран затемнён, рамка стоит ровно на кнопке, а рядом — серая плотная карточка с подписью:
  // что делает кнопка и куда ведёт. Внизу «Дальше» и «Пропустить», справа сверху крестик.
  const TOUR = [
    ["catalog", "Каталог", "Главный экран: здесь аниме и мультфильмы. Вверху — поиск по названию, автору или описанию."],
    ["favorites", "Избранное", "Сюда попадает то, что вы отложили сердечком на обложке."],
    ["vip", "VIP", "Подписка: просмотр без рекламы, отзывы первыми и золотой ник."],
    ["support", "Поддержка", "Тикеты: опишите, что случилось или что добавить. Оператор отвечает прямо в чате тикета."],
    ["profile", "Профиль", "Ваши звёзды, история просмотров и настройки."],
  ];

  function startTour() {
    if (S.me.guest || S.me.banned || S.me.tourSeen) return;
    try { if (localStorage.getItem("tourSeen")) return; } catch (_) {}
    let i = 0;
    const spot = document.createElement("div");
    spot.className = "tour-spot";
    const card = document.createElement("div");
    card.className = "tour-card";
    card.innerHTML = `<button class="tour-x" aria-label="Закрыть подсказки">&times;</button>
      <b></b><p></p>
      <div class="tour-acts"><button class="tour-skip">Пропустить</button><button class="tour-next">Дальше</button></div>`;
    document.body.appendChild(spot);
    document.body.appendChild(card);

    const place = () => {
      const [key, title, text] = TOUR[i];
      const el = document.querySelector(`[data-go="${key}"]`);
      if (el) {
        const r = el.getBoundingClientRect();
        // рамка ровно на кнопке: по 6 px запаса со всех сторон
        spot.style.left = (r.left - 6) + "px";
        spot.style.top = (r.top - 6) + "px";
        spot.style.width = (r.width + 12) + "px";
        spot.style.height = (r.height + 12) + "px";
        // карточка строго выше кнопки и никогда не накрывает её саму;
        // на низком экране прижимается к верхнему краю, но не сползает на кнопку
        card.style.left = Math.max(16, Math.min(window.innerWidth - card.offsetWidth - 16,
          r.left + r.width / 2 - card.offsetWidth / 2)) + "px";
        card.style.top = Math.max(12, r.top - card.offsetHeight - 16) + "px";
      }
      card.querySelector("b").textContent = title;
      card.querySelector("p").textContent = text;
      card.querySelector(".tour-next").textContent = i === TOUR.length - 1 ? "Готово" : "Дальше";
    };

    const finish = () => {
      spot.remove();
      card.remove();
      window.removeEventListener("resize", place);
      // больше не показываем никогда: отметка и в памяти браузера, и в базе
      try { localStorage.setItem("tourSeen", "1"); } catch (_) {}
      S.me.tourSeen = true;
      call("/api/tour", { body: {} }).catch(() => {});
    };
    const next = () => { if (++i >= TOUR.length) return finish(); place(); };
    card.querySelector(".tour-next").onclick = next;
    card.querySelector(".tour-skip").onclick = finish;
    card.querySelector(".tour-x").onclick = finish;
    window.addEventListener("resize", place);
    place();
  }

  // ---- старт ----
  async function boot() {
    const t = tg();
    if (t) { try { t.ready(); t.expand(); } catch (_) {} }
    const serviceHash = /tgWebApp/.test(location.hash);
    initData();  // кешируем подпись до того, как служебный фрагмент будет заменён
    // ни скрипта, ни подписи в ссылке — спрашиваем initData у самого клиента Telegram
    if (!initCache && window.TelegramWebviewProxy) initCache = await initDataFromProxy();
    await Promise.all([loadMe(), loadConfig()]);
    // hashchange сам вызовет render(): иначе первый экран рисуется дважды и дёргается
    if (!location.hash || serviceHash) location.hash = "#/catalog";
    else render();
    startTour();
  }
  // стартуем после defer-скриптов: DOMContentLoaded случится уже после них;
  // если скрипт Telegram не доехал (заблокирован сетью), приложение всё равно откроется
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
