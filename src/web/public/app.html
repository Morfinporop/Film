<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Каталог фильмов</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 12px;
      font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #111);
      color: var(--tg-theme-text-color, #eee);
    }
    h1 { font-size: 18px; margin: 4px 4px 12px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .card {
      border: 0; padding: 0; border-radius: 14px; overflow: hidden; cursor: pointer;
      background: var(--tg-theme-secondary-bg-color, #1c1c1e);
      color: inherit; text-align: left; display: flex; flex-direction: column;
    }
    .cover {
      width: 100%; aspect-ratio: 2 / 3; object-fit: cover; display: block;
      background: linear-gradient(135deg, #3a3a3c, #1c1c1e);
    }
    .title { padding: 8px 10px 10px; font-size: 14px; font-weight: 600; line-height: 1.25; }
    .badge {
      display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 500; opacity: .7;
    }
    .state { text-align: center; opacity: .7; margin-top: 40px; }
  </style>
</head>
<body>
  <h1>🍿 Каталог фильмов</h1>
  <div id="grid" class="grid"></div>
  <div id="state" class="state">Загрузка…</div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  let botUsername = null;

  function openFilm(film) {
    if (film.kind === 'link' && film.url) {
      if (tg) tg.openLink(film.url); else window.open(film.url, '_blank');
      return;
    }
    // видео открывается в самом боте: диплинк /start film_<id>
    const link = `https://t.me/${botUsername}?start=film_${film.id}`;
    if (tg) tg.openTelegramLink(link); else window.open(link, '_blank');
  }

  function render(films) {
    const grid = document.getElementById('grid');
    const state = document.getElementById('state');
    if (!films.length) { state.textContent = 'Пока в каталоге пусто'; return; }
    state.remove();

    for (const film of films) {
      const card = document.createElement('button');
      card.className = 'card';
      card.type = 'button';
      card.addEventListener('click', () => openFilm(film));

      const img = document.createElement('img');
      img.className = 'cover';
      img.loading = 'lazy';
      img.alt = '';
      if (film.hasBanner) img.src = `/api/banner/${film.id}`;
      card.appendChild(img);

      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = film.title;
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = film.kind === 'video' ? '▶ Смотреть в боте' : '🔗 Смотреть';
      title.appendChild(document.createElement('br'));
      title.appendChild(badge);
      card.appendChild(title);

      grid.appendChild(card);
    }
  }

  (async () => {
    try {
      const [cfg, films] = await Promise.all([
        fetch('/api/config').then((r) => r.json()),
        fetch('/api/films').then((r) => r.json()),
      ]);
      botUsername = cfg.botUsername;
      render(films);
    } catch (e) {
      document.getElementById('state').textContent = 'Не удалось загрузить каталог';
    }
  })();
</script>
</body>
</html>
